<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>香肠人跑酷大冒险</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='9' y='3' width='14' height='26' rx='7' fill='%23f7c9a3'/%3E%3Ccircle cx='13' cy='12' r='2.6' fill='%23fff'/%3E%3Ccircle cx='20' cy='12' r='2.6' fill='%23fff'/%3E%3Ccircle cx='13.6' cy='12.4' r='1.4' fill='%232b2d42'/%3E%3Ccircle cx='20.6' cy='12.4' r='1.4' fill='%232b2d42'/%3E%3C/svg%3E" />
<style>
  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", system-ui, -apple-system, sans-serif;
    color: #262a45;
    background:
      radial-gradient(1100px 620px at 6% -12%, #dcecff 0%, rgba(220,236,255,0) 62%),
      radial-gradient(900px 520px at 104% 4%, #ffe2ef 0%, rgba(255,226,239,0) 58%),
      radial-gradient(700px 500px at 50% 120%, #e2fbef 0%, rgba(226,251,239,0) 60%),
      linear-gradient(165deg, #f6f9ff 0%, #fdf6ff 100%);
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
  }
  :root {
    --ink: #262a45;
    --ink-2: #6b7194;
    --ink-3: #9aa1c0;
    --pink: #ff5b8a;
    --pink-d: #e84373;
    --yellow: #ffc53d;
    --teal: #2fc9b4;
    --purple: #7a5cff;
    --blue: #4aa8ff;
    --line: #e9edf8;
    --card: #ffffff;
    --shadow-lg: 0 24px 60px -22px rgba(58, 74, 128, .38), 0 6px 18px -8px rgba(58, 74, 128, .18);
    --shadow-sm: 0 10px 24px -14px rgba(58, 74, 128, .5);
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  #app { position: fixed; inset: 0; }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.active { display: flex; }

  /* ================= 菜单 ================= */
  #menuScreen { flex-direction: column; padding: 16px clamp(14px, 2.6vw, 34px) 18px; gap: 14px; overflow: auto; }
  .topbar { display: flex; align-items: center; gap: 14px; flex: 0 0 auto; }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand-mark {
    width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center;
    background: linear-gradient(145deg, #ffd9a8, #ffb27a);
    box-shadow: 0 8px 18px -8px rgba(255, 140, 80, .8), inset 0 -3px 0 rgba(0,0,0,.06);
  }
  .brand-mark svg { width: 26px; height: 30px; }
  .brand-txt h1 { margin: 0; font-size: 21px; letter-spacing: .5px; font-weight: 800; }
  .brand-txt p { margin: 2px 0 0; font-size: 11.5px; color: var(--ink-3); letter-spacing: 2.4px; font-weight: 600; }
  .topbar-spacer { flex: 1; }
  .stat-chip {
    display: flex; align-items: center; gap: 7px; padding: 9px 15px; border-radius: 999px;
    background: #fff; box-shadow: var(--shadow-sm); font-weight: 800; font-size: 15px;
    border: 1.5px solid #fff;
  }
  .stat-chip .ico { width: 17px; height: 17px; color: var(--yellow); filter: drop-shadow(0 2px 3px rgba(255,180,0,.45)); }
  .stat-chip.energy { color: #b87600; }
  .stat-chip.best { color: var(--ink-2); font-size: 13.5px; }
  .stat-chip.best .ico { color: var(--pink); }

  .menu-grid { flex: 1 1 auto; display: grid; grid-template-columns: minmax(268px, 330px) 1fr; gap: 16px; min-height: 0; }

  .panel { background: var(--card); border-radius: 26px; box-shadow: var(--shadow-lg); }

  /* ---- 角色面板 ---- */
  .avatar-panel { display: flex; flex-direction: column; padding: 18px 18px 18px; position: relative; overflow: hidden; }
  .avatar-panel::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 190px;
    background: radial-gradient(120% 100% at 50% 0%, #eaf3ff 0%, rgba(234,243,255,0) 72%);
    pointer-events: none;
  }
  .avatar-stage { position: relative; flex: 1 1 auto; min-height: 190px; display: grid; place-items: center; }
  #previewCanvas { width: 100%; max-width: 250px; height: auto; display: block; position: relative; z-index: 1; }
  .avatar-name { text-align: center; font-size: 17px; font-weight: 800; margin-top: 2px; }
  .avatar-perk {
    text-align: center; font-size: 12.5px; color: var(--ink-2); margin: 7px 0 0; line-height: 1.5; min-height: 19px;
  }
  .avatar-perk b { color: var(--teal); font-weight: 800; }
  .btn-start {
    margin-top: 14px; width: 100%; padding: 15px 18px; border-radius: 17px; font-size: 17px; font-weight: 800;
    color: #fff; letter-spacing: 2px;
    background: linear-gradient(135deg, #ff7aa2 0%, #ff5b8a 42%, #ff9548 100%);
    box-shadow: 0 14px 26px -12px rgba(255, 91, 138, .95), inset 0 -4px 0 rgba(0,0,0,.12);
    transition: transform .12s ease, box-shadow .12s ease;
    display: flex; align-items: center; justify-content: center; gap: 9px;
  }
  .btn-start:hover { transform: translateY(-2px); box-shadow: 0 20px 32px -12px rgba(255, 91, 138, .95), inset 0 -4px 0 rgba(0,0,0,.12); }
  .btn-start:active { transform: translateY(1px) scale(.99); }
  .btn-start svg { width: 15px; height: 15px; }
  .ctrl-hint {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 12px;
    margin-top: 11px; font-size: 11.5px; color: var(--ink-3); font-weight: 700;
  }
  .ctrl-hint span { display: flex; align-items: center; gap: 4px; }
  .ctrl-hint kbd {
    display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px;
    border-radius: 5px; background: #eef2fb; color: var(--ink-2); font-size: 10.5px; font-weight: 800;
    font-family: inherit; box-shadow: inset 0 -1.5px 0 rgba(120,140,190,.25);
  }

  /* ---- 商店 ---- */
  .shop-panel { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .shop-head { display: flex; align-items: center; gap: 6px; padding: 14px 16px 0; flex: 0 0 auto; }
  .tab {
    padding: 9px 17px; border-radius: 13px; font-size: 14px; font-weight: 800; color: var(--ink-3);
    display: flex; align-items: center; gap: 6px; transition: all .16s ease; white-space: nowrap;
  }
  .tab svg { width: 15px; height: 15px; }
  .tab:hover { color: var(--ink-2); background: #f4f7fd; }
  .tab.on { color: #fff; background: linear-gradient(135deg, #7a8dff, #6a5cff); box-shadow: 0 8px 16px -9px rgba(106, 92, 255, .95); }
  .shop-hint { margin-left: auto; font-size: 12px; color: var(--ink-3); font-weight: 600; }
  .items {
    flex: 1 1 auto; overflow-y: auto; padding: 14px 16px 18px; min-height: 0;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); gap: 12px; align-content: start;
    scrollbar-width: thin; scrollbar-color: #d8e0f0 transparent;
  }
  .items::-webkit-scrollbar { width: 9px; }
  .items::-webkit-scrollbar-thumb { background: #dbe3f3; border-radius: 9px; border: 2px solid #fff; }

  .item {
    position: relative; border-radius: 19px; background: #fbfcff; border: 2px solid var(--line);
    padding: 11px 11px 12px; display: flex; flex-direction: column; align-items: center; gap: 7px;
    transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
  }
  .item:hover { transform: translateY(-3px); border-color: #d5e0f7; box-shadow: 0 16px 28px -20px rgba(60, 80, 140, .8); }
  .item.equipped { border-color: #9fe3d7; background: linear-gradient(180deg, #f2fffb, #fbfcff); }
  .item.locked .item-prev { filter: grayscale(.35) opacity(.72); }
  .item-tag {
    position: absolute; top: 8px; right: 8px; font-size: 10.5px; font-weight: 800; padding: 3px 7px; border-radius: 7px;
    background: #e7fbf6; color: #12a189; letter-spacing: .5px;
  }
  .item-prev { width: 88px; height: 100px; display: block; }
  .item-name { font-size: 13.5px; font-weight: 800; text-align: center; line-height: 1.25; }
  .item-perk { font-size: 11px; color: var(--ink-3); text-align: center; line-height: 1.35; min-height: 30px; }
  .item-btn {
    width: 100%; padding: 8px 6px; border-radius: 11px; font-size: 12.5px; font-weight: 800;
    background: #eef2fb; color: var(--ink-2); transition: all .14s ease; display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .item-btn svg { width: 12px; height: 12px; }
  .item-btn.buy { background: linear-gradient(135deg, #ffd45e, #ffb800); color: #6b4300; box-shadow: 0 7px 14px -9px rgba(255, 184, 0, .95); }
  .item-btn.buy:hover { transform: translateY(-1px); }
  .item-btn.buy:disabled { background: #f0f2f8; color: #b3b9cd; box-shadow: none; cursor: not-allowed; transform: none; }
  .item-btn.wear { background: linear-gradient(135deg, #6fe3cd, #2fc9b4); color: #fff; box-shadow: 0 7px 14px -9px rgba(47, 201, 180, .95); }
  .item-btn.wear:hover { transform: translateY(-1px); }
  .item-btn.done { background: #eef2fb; color: #a8afc6; cursor: default; }

  /* ================= 游戏 ================= */
  #playScreen { padding: 8px; align-items: center; justify-content: center; }
  .stage-wrap {
    position: relative; aspect-ratio: 16 / 9; border-radius: 22px; overflow: hidden;
    width: min(100%, calc((100vh - 16px) * 16 / 9));
    box-shadow: 0 30px 70px -30px rgba(50, 70, 130, .55);
    background: #cdeaff;
  }
  #gameCanvas { width: 100%; height: 100%; display: block; touch-action: none; }

  .hud { position: absolute; inset: 0; pointer-events: none; font-size: 14px; }
  .hud-top { position: absolute; top: 0; left: 0; right: 0; padding: 12px 14px; display: flex; align-items: flex-start; gap: 10px; }
  .hud-left { display: flex; flex-direction: column; gap: 7px; }
  .hud-center { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 2px; }
  .hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }

  .hearts { display: flex; gap: 3px; }
  .hearts svg { width: 21px; height: 21px; color: #ff4d74; filter: drop-shadow(0 2px 3px rgba(255, 70, 110, .45)); transition: transform .2s ease; }
  .hearts svg.off { color: #ffffff; opacity: .42; filter: none; }
  .hearts svg.pop { transform: scale(1.35); }

  .weapon-chips { display: flex; gap: 6px; }
  .wchip {
    display: flex; align-items: center; gap: 6px; padding: 5px 11px 5px 8px; border-radius: 12px;
    background: rgba(255,255,255,.86); backdrop-filter: blur(6px); border: 2px solid rgba(255,255,255,.92);
    box-shadow: 0 6px 14px -10px rgba(40, 60, 110, .9); position: relative; overflow: hidden;
    transition: transform .15s ease;
  }
  .wchip svg { width: 17px; height: 17px; flex: 0 0 auto; }
  .wchip .n { font-size: 13.5px; font-weight: 900; color: var(--ink); min-width: 12px; text-align: center; }
  .wchip .bar { position: absolute; left: 0; bottom: 0; height: 4px; background: #2fc9b4; transition: width .2s ease; }
  .wchip.empty { opacity: .42; }
  .wchip.need { animation: needPulse .7s ease-in-out infinite; border-color: #ff5b8a; }
  .wchip.need .bar { background: #ff5b8a; }
  @keyframes needPulse { 0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,91,138,.55); } 50% { transform: scale(1.07); box-shadow: 0 0 0 7px rgba(255,91,138,0); } }

  .stage-pill {
    padding: 5px 15px; border-radius: 999px; background: rgba(255,255,255,.85); backdrop-filter: blur(6px);
    font-weight: 800; font-size: 13px; letter-spacing: .5px; color: var(--ink);
    box-shadow: 0 6px 14px -10px rgba(40,60,110,.9);
  }
  .dist-txt {
    font-size: 12px; font-weight: 800; color: #fff; letter-spacing: .8px;
    background: rgba(38, 42, 69, .42); padding: 3px 12px; border-radius: 999px;
    backdrop-filter: blur(4px);
  }
  .energy-pill {
    display: flex; align-items: center; gap: 6px; padding: 6px 13px; border-radius: 999px;
    background: rgba(255,255,255,.85); backdrop-filter: blur(6px); font-weight: 800; font-size: 13.5px; color: #b87600;
    box-shadow: 0 6px 14px -10px rgba(40,60,110,.9);
  }
  .energy-pill svg { width: 14px; height: 14px; color: var(--yellow); }

  .icon-btn {
    pointer-events: auto; width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center;
    background: rgba(255,255,255,.85); backdrop-filter: blur(6px); box-shadow: 0 6px 14px -10px rgba(40,60,110,.9);
    transition: transform .12s ease;
  }
  .icon-btn:hover { transform: scale(1.06); }
  .icon-btn svg { width: 16px; height: 16px; color: var(--ink-2); }

  /* 方向键 */
  .dpad {
    position: absolute; left: calc(16px * var(--hud, 1)); bottom: calc(16px * var(--hud, 1));
    width: calc(148px * var(--hud, 1)); height: calc(148px * var(--hud, 1));
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 5px;
    pointer-events: none;
  }
  .dbtn {
    pointer-events: auto; border-radius: 15px; display: grid; place-items: center;
    background: rgba(255,255,255,.82); backdrop-filter: blur(7px);
    box-shadow: 0 8px 18px -12px rgba(30,50,90,.95), inset 0 -3px 0 rgba(120,140,190,.16);
    color: #4a5580; transition: transform .08s ease, background .12s ease;
    touch-action: none;
  }
  .dbtn:active, .dbtn.down { transform: scale(.93); background: rgba(255,255,255,.98); }
  .dbtn svg { width: calc(21px * var(--hud, 1)); height: calc(21px * var(--hud, 1)); }
  .dbtn.up { grid-area: 1 / 2; }
  .dbtn.left { grid-area: 2 / 1; }
  .dbtn.right { grid-area: 2 / 3; }
  .dbtn.down-b { grid-area: 3 / 2; }
  .dpad-mid { grid-area: 2 / 2; display: grid; place-items: center; }

  /* 击打按钮 */
  .attack-wrap { position: absolute; right: calc(18px * var(--hud, 1)); bottom: calc(18px * var(--hud, 1)); pointer-events: none; }
  .attack-btn {
    pointer-events: auto; position: relative; width: calc(108px * var(--hud, 1)); height: calc(108px * var(--hud, 1));
    border-radius: 50%;
    display: grid; place-items: center; color: #fff; font-weight: 900;
    font-size: calc(20px * var(--hud, 1)); letter-spacing: 3px;
    background: radial-gradient(circle at 34% 28%, #ff9db8, #ff5b8a 48%, #e03b6c 100%);
    box-shadow: 0 16px 30px -14px rgba(224, 59, 108, .95), inset 0 -6px 0 rgba(0,0,0,.14), inset 0 4px 10px rgba(255,255,255,.45);
    transition: transform .09s ease;
    text-shadow: 0 2px 5px rgba(160, 20, 60, .5); touch-action: none;
  }
  .attack-btn:active { transform: scale(.92); }
  .attack-btn::after {
    content: ""; position: absolute; inset: -7px; border-radius: 50%; border: 3px solid rgba(255, 91, 138, .38);
    animation: ringIdle 2.4s ease-out infinite;
  }
  @keyframes ringIdle { 0% { transform: scale(.93); opacity: .8; } 70%,100% { transform: scale(1.16); opacity: 0; } }
  .attack-btn.hot { background: radial-gradient(circle at 34% 28%, #ffe07a, #ffb800 45%, #ff7a2f 100%); box-shadow: 0 16px 34px -12px rgba(255, 150, 40, 1), inset 0 -6px 0 rgba(0,0,0,.14), inset 0 4px 10px rgba(255,255,255,.5); }
  .attack-btn.hot::after { border-color: rgba(255, 200, 60, .7); animation-duration: .9s; }
  @media (hover: none) { .atk-hint { display: none; } }
  .atk-hint {
    position: absolute; bottom: calc(134px * var(--hud, 1)); right: calc(20px * var(--hud, 1));
    font-size: 11px; font-weight: 800; color: #fff;
    background: rgba(38, 42, 69, .4); padding: 4px 11px; border-radius: 999px; backdrop-filter: blur(4px);
    pointer-events: none; white-space: nowrap;
  }

  /* ---- 竖屏提示 ---- */
  .rotate-tip {
    position: fixed; inset: 0; z-index: 60; display: none; place-items: center; text-align: center;
    background: linear-gradient(160deg, #eef5ff 0%, #fdf1ff 100%); padding: 28px;
  }
  body.portrait.playing .rotate-tip { display: grid; }
  .rotate-card { max-width: 300px; }
  .rotate-ico {
    width: 92px; height: 92px; margin: 0 auto 18px; display: block; color: var(--pink);
    animation: tiltPhone 2.2s ease-in-out infinite;
  }
  @keyframes tiltPhone {
    0%, 30% { transform: rotate(0deg); }
    60%, 100% { transform: rotate(-90deg); }
  }
  .rt-title { font-size: 21px; font-weight: 900; letter-spacing: 1px; margin-bottom: 8px; }
  .rt-sub { font-size: 13px; color: var(--ink-3); line-height: 1.6; }

  /* 暂停覆盖层 */
  .overlay {
    position: absolute; inset: 0; display: none; place-items: center; background: rgba(24, 32, 60, .5);
    backdrop-filter: blur(5px); z-index: 20; pointer-events: auto;
  }
  .overlay.on { display: grid; }
  .overlay-card { background: #fff; border-radius: 24px; padding: 26px 30px; text-align: center; box-shadow: 0 30px 60px -20px rgba(10,20,50,.6); min-width: 240px; }
  .overlay-card h3 { margin: 0 0 16px; font-size: 19px; letter-spacing: 1px; }
  .overlay-card .btn-row { display: flex; flex-direction: column; gap: 9px; }
  .obtn { padding: 12px 22px; border-radius: 13px; font-weight: 800; font-size: 14.5px; background: #eef2fb; color: var(--ink-2); transition: all .14s; }
  .obtn:hover { background: #e4eaf8; }
  .obtn.primary { background: linear-gradient(135deg, #ff7aa2, #ff5b8a); color: #fff; box-shadow: 0 10px 20px -10px rgba(255,91,138,.9); }

  /* ================= 结算 ================= */
  #overScreen { align-items: center; justify-content: center; padding: 20px; }
  .over-card {
    width: min(440px, 100%); background: #fff; border-radius: 28px; padding: 28px 30px 24px; text-align: center;
    box-shadow: 0 40px 80px -30px rgba(40, 60, 120, .55); position: relative; overflow: hidden;
    animation: popIn .38s cubic-bezier(.2, 1.3, .5, 1) both;
  }
  @keyframes popIn { from { transform: scale(.86) translateY(16px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
  .over-card::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 130px;
    background: radial-gradient(110% 100% at 50% 0%, #ffeaf1 0%, rgba(255,234,241,0) 75%);
  }
  .over-badge { position: relative; width: 74px; height: 74px; margin: 0 auto 6px; border-radius: 24px; display: grid; place-items: center; background: linear-gradient(145deg, #ffe0ea, #ffc2d6); }
  .over-badge svg { width: 38px; height: 38px; color: #ff5b8a; }
  .over-title { position: relative; font-size: 24px; font-weight: 900; margin: 6px 0 6px; letter-spacing: 1px; }
  .over-reason { position: relative; font-size: 13.5px; color: var(--ink-2); line-height: 1.55; margin-bottom: 18px; min-height: 21px; }
  .over-stats { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
  .ostat { background: #f7f9ff; border-radius: 15px; padding: 11px 6px; }
  .ostat .lbl { font-size: 11px; color: var(--ink-3); font-weight: 700; letter-spacing: .5px; }
  .ostat .val { font-size: 20px; font-weight: 900; margin-top: 2px; }
  .ostat .val.gold { color: #e39b00; }
  .over-gain { position: relative; font-size: 12.5px; color: var(--teal); font-weight: 800; margin: -10px 0 16px; }
  .over-actions { position: relative; display: flex; gap: 10px; }
  .over-actions button { flex: 1; padding: 14px; border-radius: 15px; font-size: 15px; font-weight: 800; transition: transform .12s; }
  .over-actions button:active { transform: scale(.97); }
  .btn-again { color: #fff; background: linear-gradient(135deg, #ff7aa2, #ff5b8a); box-shadow: 0 12px 24px -12px rgba(255,91,138,.95); }
  .btn-home { background: #eef2fb; color: var(--ink-2); }

  @media (max-width: 860px) {
    .menu-grid { grid-template-columns: 1fr; }
    .avatar-panel { flex-direction: row; align-items: center; gap: 14px; padding: 14px; }
    .avatar-stage { min-height: 120px; flex: 0 0 120px; }
    #previewCanvas { max-width: 110px; }
    .avatar-name, .avatar-perk { text-align: left; }
    .btn-start { margin-top: 0; width: auto; padding: 13px 20px; font-size: 15px; }
    .avatar-info { flex: 1; }
    .brand-txt p { display: none; }
  }
  @media (max-width: 560px) {
    .topbar { gap: 8px; }
    .brand { gap: 8px; }
    .brand-mark { width: 38px; height: 38px; border-radius: 12px; }
    .brand-mark svg { width: 21px; height: 24px; }
    .brand-txt h1 { font-size: 15px; white-space: nowrap; letter-spacing: 0; }
    .stat-chip { padding: 7px 10px; font-size: 12.5px; gap: 5px; }
    .stat-chip .ico { width: 14px; height: 14px; }
    .stat-chip.best { font-size: 12px; }
    .items { grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 9px; padding: 12px; }
    .item-prev { width: 72px; height: 84px; }
    .atk-hint { display: none; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ========== 更衣室 / 主菜单 ========== -->
  <section id="menuScreen" class="screen active">
    <div class="topbar">

const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const easeOut = (t) => 1 - Math.pow(1 - t, 3);

function hash(n) {
  const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}
function shade(hex, amt) {
  let c = hex.replace("#", "");
  if (c.length === 3) c = c.split("").map((x) => x + x).join("");
  const n = parseInt(c, 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}
function isDarkColor(hex) {
  let c = hex.replace("#", "");
  if (c.length === 3) c = c.split("").map((x) => x + x).join("");
  const n = parseInt(c, 16);
  return ((n >> 16) * 0.299 + ((n >> 8) & 255) * 0.587 + (n & 255) * 0.114) < 108;
}
function rr(g, x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function circle(g, x, y, r) {
  g.beginPath();
  g.arc(x, y, r, 0, Math.PI * 2);
  g.closePath();
}
function star(g, cx, cy, r, n, inner) {
  g.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = (Math.PI / n) * i - Math.PI / 2;
    const rr2 = i % 2 ? r * inner : r;
    const px = cx + Math.cos(a) * rr2;
    const py = cy + Math.sin(a) * rr2;
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.closePath();
}

const Sound = {
  ac: null,
  enabled: true,
  init() {
    if (this.ac) return;
    try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ac = null; }
  },
  beep(freq, dur, type, vol, slideTo) {
    if (!this.enabled) return;
    this.init();
    if (!this.ac) return;
    if (this.ac.state === "suspended") this.ac.resume();
    const t = this.ac.currentTime;
    const o = this.ac.createOscillator();
    const g = this.ac.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.07, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.ac.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  jump() { this.beep(420, 0.16, "triangle", 0.07, 720); },
  land() { this.beep(180, 0.09, "sine", 0.05, 120); },
  coin() { this.beep(880, 0.1, "sine", 0.06, 1320); },
  hit() { this.beep(200, 0.11, "square", 0.06, 90); },

};
