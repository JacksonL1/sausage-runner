};

/* ==================================================================
   5. 角色绘制（香肠人）
   ================================================================== */
function drawSausage(g, cx, footY, s, opt) {
  opt = opt || {};
  const cos = getCostume(opt.costume);
  const acc = getAccessory(opt.accessory);
  const phase = opt.phase || 0;
  const sliding = !!opt.sliding;
  const airborne = !!opt.airborne;
  const facing = opt.facing || 1;
  const base = cos.color;
  const dark = shade(base, -34);
  const light = shade(base, 26);

  g.save();
  g.translate(cx, footY);
  g.scale(facing, 1);

  /* ---- 披风 ---- */
  if (acc.id === "cape" && !sliding) {
    const flap = Math.sin(phase * 0.9) * 5 * s;
    g.fillStyle = "#ff5b8a";
    g.beginPath();
    g.moveTo(-10 * s, -76 * s);
    g.bezierCurveTo(-42 * s, -66 * s + flap, -50 * s, -34 * s + flap, -30 * s, -10 * s + flap);
    g.lineTo(-12 * s, -30 * s);
    g.closePath();
    g.fill();
    g.fillStyle = "rgba(255,255,255,.28)";
    g.beginPath();
    g.moveTo(-14 * s, -72 * s);
    g.bezierCurveTo(-36 * s, -62 * s + flap, -42 * s, -38 * s + flap, -28 * s, -18 * s + flap);
    g.lineTo(-20 * s, -30 * s);
    g.closePath();
    g.fill();
  }

  let bw, bh, bodyTop;
  if (sliding) {
    /* ============ 滑铲姿态 ============ */
    bw = 74 * s; bh = 36 * s;
    const bodyBottom = -4 * s;
    bodyTop = bodyBottom - bh;
    // 速度线
    g.strokeStyle = "rgba(255,255,255,.75)";
    g.lineWidth = 2.6 * s;
    g.lineCap = "round";
    for (let i = 0; i < 3; i++) {
      const yy = bodyTop + (8 + i * 9) * s;
      g.beginPath();
      g.moveTo(-bw / 2 - (16 + i * 8) * s, yy);
      g.lineTo(-bw / 2 - (4 + i * 3) * s, yy);
      g.stroke();
    }
    // 身体
    const gr = g.createLinearGradient(-bw / 2, bodyTop, bw / 2, bodyBottom);
    gr.addColorStop(0, light); gr.addColorStop(0.55, base); gr.addColorStop(1, dark);
    g.fillStyle = gr;
    rr(g, -bw / 2, bodyTop, bw, bh, bh / 2);
    g.fill();
    g.save();
    rr(g, -bw / 2, bodyTop, bw, bh, bh / 2);
    g.clip();
    drawCostumePattern(g, cos, bw, bh, bodyTop, bodyBottom, s);
    g.restore();
    g.strokeStyle = "rgba(70,45,30,.16)"; g.lineWidth = 2 * s;
    rr(g, -bw / 2, bodyTop, bw, bh, bh / 2); g.stroke();

    // 脸（靠右）
    drawFace(g, 12 * s, bodyTop + bh * 0.42, s * 0.86, phase, true);
    // 脚
    g.fillStyle = dark;
    rr(g, -bw / 2 - 2 * s, bodyBottom - 8 * s, 12 * s, 12 * s, 5 * s); g.fill();
    g.restore();
    return;
  }

  /* ============ 站立 / 奔跑姿态 ============ */
  bw = 48 * s; bh = 64 * s;
  const bodyBottom = -13 * s;
  bodyTop = bodyBottom - bh;

  // 腿
  const swing = airborne ? -5 * s : Math.sin(phase) * 6 * s;
  g.fillStyle = dark;
  rr(g, -13 * s + swing * 0.55, bodyBottom - 1 * s, 9.5 * s, 14 * s, 4.7 * s); g.fill();
  rr(g, 3.5 * s - swing * 0.55, bodyBottom - 1 * s, 9.5 * s, 14 * s, 4.7 * s); g.fill();
  // 鞋
  g.fillStyle = "#4a5580";
  rr(g, -14 * s + swing * 0.55, -5 * s, 12 * s, 5.5 * s, 2.6 * s); g.fill();
  rr(g, 2.5 * s - swing * 0.55, -5 * s, 12 * s, 5.5 * s, 2.6 * s); g.fill();

  // 手臂（后）
  g.strokeStyle = isDarkColor(base) ? shade(base, 26) : shade(base, -18);
  g.lineWidth = 8 * s; g.lineCap = "round";
  const armSwing = airborne ? -20 * s : Math.sin(phase + Math.PI) * 12 * s;
  g.beginPath();
  g.moveTo(-bw / 2 + 4 * s, bodyTop + 30 * s);
  g.lineTo(-bw / 2 - 7 * s, bodyTop + 44 * s + armSwing * 0.5);
  g.stroke();

  // 身体
  const gr2 = g.createLinearGradient(-bw / 2, bodyTop, bw / 2, bodyBottom);
  gr2.addColorStop(0, light); gr2.addColorStop(0.5, base); gr2.addColorStop(1, dark);
  g.fillStyle = gr2;
  rr(g, -bw / 2, bodyTop, bw, bh, bw / 2);
  g.fill();

  g.save();
  rr(g, -bw / 2, bodyTop, bw, bh, bw / 2);
  g.clip();
  drawCostumePattern(g, cos, bw, bh, bodyTop, bodyBottom, s);
  g.restore();

  g.strokeStyle = "rgba(70,45,30,.16)"; g.lineWidth = 2 * s;
  rr(g, -bw / 2, bodyTop, bw, bh, bw / 2); g.stroke();

  // 高光
  g.fillStyle = "rgba(255,255,255,.4)";
  g.beginPath();
  g.ellipse(-bw * 0.2, bodyTop + bh * 0.26, 5 * s, 14 * s, -0.18, 0, Math.PI * 2);
  g.fill();

  // 机械装甲肩甲
  if (cos.pattern === "mech") {
    g.fillStyle = "#8fa0b6";
    rr(g, -bw / 2 - 5 * s, bodyTop + 24 * s, 12 * s, 13 * s, 5 * s); g.fill();
    rr(g, bw / 2 - 7 * s, bodyTop + 24 * s, 12 * s, 13 * s, 5 * s); g.fill();
    g.fillStyle = cos.accent;
    circle(g, bw / 2 - 1 * s, bodyTop + 30.5 * s, 2.4 * s); g.fill();
  }

  // 脸
  drawFace(g, 2 * s, bodyTop + 24 * s, s, phase, false);

  // 前手臂
  g.strokeStyle = base;
  g.lineWidth = 8.5 * s; g.lineCap = "round";
  g.beginPath();
  g.moveTo(bw / 2 - 4 * s, bodyTop + 30 * s);
  g.lineTo(bw / 2 + 8 * s, bodyTop + 42 * s - armSwing * 0.5);
  g.stroke();
  g.fillStyle = light;
  circle(g, bw / 2 + 8 * s, bodyTop + 42 * s - armSwing * 0.5, 4.6 * s);
  g.fill();

  /* ---- 配饰 ---- */
  drawAccessory(g, acc, s, bodyTop, bw, phase);

  g.restore();
}

function drawFace(g, ox, oy, s, phase, sliding) {
  const blink = Math.sin(phase * 0.75) > 0.985 ? 0.12 : 1;
  const eyeY = oy;
  const erx = 7.4 * s, ery = 8.8 * s * blink;
  // 眼白
  g.fillStyle = "#ffffff";
  g.beginPath(); g.ellipse(ox - 9.5 * s, eyeY, erx, ery, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(ox + 9.5 * s, eyeY, erx, ery, 0, 0, Math.PI * 2); g.fill();
  // 瞳孔
  g.fillStyle = "#2b2d42";
  circle(g, ox - 8.6 * s, eyeY + 0.8 * s, 4 * s * blink); g.fill();
  circle(g, ox + 10.4 * s, eyeY + 0.8 * s, 4 * s * blink); g.fill();
  // 眼神光
  g.fillStyle = "#ffffff";
  circle(g, ox - 7.4 * s, eyeY - 1.3 * s, 1.5 * s); g.fill();
  circle(g, ox + 11.6 * s, eyeY - 1.3 * s, 1.5 * s); g.fill();
  // 腮红
  g.fillStyle = "rgba(255,120,150,.32)";
  g.beginPath(); g.ellipse(ox - 15 * s, eyeY + 9 * s, 4.6 * s, 3 * s, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(ox + 16 * s, eyeY + 9 * s, 4.6 * s, 3 * s, 0, 0, Math.PI * 2); g.fill();
  // 嘴
  g.strokeStyle = "#8c4a2f";
  g.lineWidth = 1.9 * s;
  g.lineCap = "round";
  g.beginPath();
  if (sliding) {
    g.arc(ox, eyeY + 12 * s, 3.6 * s, 0.15, Math.PI - 0.15);
  } else {
    g.arc(ox, eyeY + 11 * s, 3.4 * s, 0.2, Math.PI - 0.2);
  }
  g.stroke();
}

function drawCostumePattern(g, cos, bw, bh, top, bottom, s) {
  const p = cos.pattern;
  if (p === "none" || !p) return;
  if (p === "dots") {
    g.fillStyle = cos.accent;
    for (let y = top + 8 * s; y < bottom; y += 20 * s) {
      for (let x = -bw / 2 + 6 * s; x < bw / 2; x += 20 * s) {
        circle(g, x + ((y / (20 * s)) | 0) % 2 * 10 * s, y, 3.6 * s);
        g.fill();
      }
    }
  } else if (p === "stripe") {
    g.fillStyle = cos.accent;
    for (let y = top + 6 * s; y < bottom; y += 16 * s) {
      g.fillRect(-bw / 2, y, bw, 7 * s);
    }
  } else if (p === "flame") {
    for (let i = 0; i < 4; i++) {
      const fx = -bw / 2 + 8 * s + i * 13 * s;
      const fh = (20 + hash(i) * 16) * s;
      g.fillStyle = i % 2 ? "#ffd166" : "#ffe9a8";
      g.beginPath();
      g.moveTo(fx, bottom);
      g.quadraticCurveTo(fx - 7 * s, bottom - fh * 0.7, fx + 2 * s, bottom - fh);
      g.quadraticCurveTo(fx + 11 * s, bottom - fh * 0.6, fx + 8 * s, bottom);
      g.closePath();
      g.fill();
    }
  } else if (p === "stars") {
    for (let i = 0; i < 9; i++) {
      const sx = -bw / 2 + 6 * s + hash(i * 2.1) * (bw - 12 * s);
      const sy = top + 8 * s + hash(i * 5.3) * (bh - 12 * s);
      g.fillStyle = i % 3 === 0 ? "#ffffff" : cos.accent;
      star(g, sx, sy, (2.2 + hash(i) * 2) * s, 4, 0.42);
      g.fill();
    }
  } else if (p === "mech") {
    g.strokeStyle = "rgba(80,110,150,.35)";
    g.lineWidth = 1.6 * s;
    for (let y = top + 14 * s; y < bottom; y += 16 * s) {
      g.beginPath(); g.moveTo(-bw / 2, y); g.lineTo(bw / 2, y); g.stroke();
    }
    // 胸核
    const cx = 0, cy = top + bh * 0.62;
    g.fillStyle = "rgba(47,201,180,.28)";
    circle(g, cx, cy, 9 * s); g.fill();
    g.fillStyle = cos.accent;
    circle(g, cx, cy, 5.2 * s); g.fill();
    g.fillStyle = "rgba(255,255,255,.9)";
    circle(g, cx - 1.4 * s, cy - 1.4 * s, 1.9 * s); g.fill();
  } else if (p === "rainbow") {
    const cols = ["#ff8fab", "#ffc53d", "#7ee081", "#5fd8ff", "#9d88ea"];
    for (let i = 0; i < cols.length; i++) {
      g.fillStyle = cols[i];
      g.fillRect(-bw / 2, top + (bh / cols.length) * i, bw, bh / cols.length + 0.5);
    }
    g.fillStyle = "rgba(255,255,255,.22)";
    g.fillRect(-bw / 2, top, bw * 0.3, bh);
  }
}

function drawAccessory(g, acc, s, top, bw, phase) {
  if (acc.id === "cap") {
    g.fillStyle = "#ff5b8a";
    g.beginPath();
    g.ellipse(0, top + 3 * s, 24 * s, 17 * s, 0, Math.PI, Math.PI * 2);
    g.fill();
    g.fillStyle = "#e03b6c";
    rr(g, 4 * s, top - 1 * s, 26 * s, 6 * s, 3 * s);
    g.fill();
    g.fillStyle = "#ffffff";
    circle(g, 0, top - 12 * s, 3 * s); g.fill();
  } else if (acc.id === "crown") {
    g.fillStyle = "#ffc53d";
    g.beginPath();
    g.moveTo(-15 * s, top + 2 * s);
    g.lineTo(-15 * s, top - 12 * s);
    g.lineTo(-7 * s, top - 5 * s);
    g.lineTo(0, top - 15 * s);
    g.lineTo(7 * s, top - 5 * s);
    g.lineTo(15 * s, top - 12 * s);
    g.lineTo(15 * s, top + 2 * s);
    g.closePath();
    g.fill();
    g.strokeStyle = "#e39b00"; g.lineWidth = 1.4 * s; g.stroke();
    g.fillStyle = "#ff5b8a";
    circle(g, 0, top - 2 * s, 2.6 * s); g.fill();
  } else if (acc.id === "goggles") {
    g.strokeStyle = "#4a5580";
    g.lineWidth = 4.5 * s;
    g.beginPath();
    g.moveTo(-24 * s, top + 12 * s);
    g.lineTo(24 * s, top + 12 * s);
    g.stroke();
    g.fillStyle = "rgba(95,216,255,.78)";
    rr(g, -21 * s, top + 4 * s, 17 * s, 13 * s, 6 * s); g.fill();
    rr(g, 4 * s, top + 4 * s, 17 * s, 13 * s, 6 * s); g.fill();
    g.strokeStyle = "#2b3a55"; g.lineWidth = 2.2 * s;
    rr(g, -21 * s, top + 4 * s, 17 * s, 13 * s, 6 * s); g.stroke();
    rr(g, 4 * s, top + 4 * s, 17 * s, 13 * s, 6 * s); g.stroke();
    g.fillStyle = "rgba(255,255,255,.65)";
    g.beginPath(); g.ellipse(-15 * s, top + 8 * s, 4.5 * s, 2.4 * s, -0.4, 0, Math.PI * 2); g.fill();
  } else if (acc.id === "headphones") {
    g.strokeStyle = "#4a5580"; g.lineWidth = 5 * s; g.lineCap = "round";
    g.beginPath();
    g.arc(0, top + 6 * s, 25 * s, Math.PI * 1.06, Math.PI * 1.94);
    g.stroke();
    g.fillStyle = "#9d88ea";
    rr(g, -30 * s, top + 2 * s, 11 * s, 18 * s, 5 * s); g.fill();
    rr(g, 19 * s, top + 2 * s, 11 * s, 18 * s, 5 * s); g.fill();
    g.fillStyle = "#c9bbff";
    rr(g, -27 * s, top + 6 * s, 5 * s, 10 * s, 2.5 * s); g.fill();
    rr(g, 22 * s, top + 6 * s, 5 * s, 10 * s, 2.5 * s); g.fill();
  }
}

/* ==================================================================
   6. 武器 / 怪兽绘制
   ================================================================== */
function drawWeaponIcon(g, cx, cy, size, type, color, rot) {
  g.save();
  g.translate(cx, cy);
  if (rot) g.rotate(rot);
  const k = size / 24;
  g.scale(k, k);
  const col = color || getWeapon(type).color;
  g.fillStyle = col;
  if (type === "sword") {
    g.beginPath();
    g.moveTo(0, -11); g.lineTo(3.4, -3); g.lineTo(0, -1.2); g.lineTo(-3.4, -3);
    g.closePath(); g.fill();
    g.fillStyle = "#e8f6ff";
    g.beginPath();
    g.moveTo(0, -10); g.lineTo(1.4, -3.4); g.lineTo(0, -2.6); g.lineTo(-1.4, -3.4);
    g.closePath(); g.fill();
    g.fillStyle = "#93a1bb"; g.fillRect(-1, -1.6, 2, 6.4);
    g.fillStyle = "#ffc53d"; rr(g, -4.2, 4.6, 8.4, 2.2, 1.1); g.fill();
    g.fillStyle = "#b07a4c"; rr(g, -0.9, 6.6, 1.8, 4.2, 0.9); g.fill();
    // 光晕
    g.globalAlpha = 0.5;
    g.fillStyle = col;
    circle(g, 0, -6, 5.5); g.fill();
  } else if (type === "gun") {
    g.fillStyle = col; rr(g, -10, -4, 15, 5, 2.5); g.fill();
    g.fillStyle = "#93a1bb"; rr(g, 4, -2.8, 8, 2.2, 1.1); g.fill();
    g.fillStyle = "#4a4f6a";
    g.beginPath(); g.moveTo(-6, 1); g.lineTo(-2, 1); g.lineTo(-3.4, 8); g.lineTo(-7, 8); g.closePath(); g.fill();
    g.fillStyle = "rgba(255,255,255,.75)"; circle(g, -7, -1.6, 1.5); g.fill();
    g.globalAlpha = 0.55; g.fillStyle = col; circle(g, 2, -1.5, 5); g.fill();
  } else {
    g.fillStyle = col; rr(g, -10, -3, 17, 6, 3); g.fill();
    g.globalAlpha = 0.85; g.fillStyle = "#ffffff"; circle(g, 8.6, 0, 3.3); g.fill();
    g.globalAlpha = 1; g.fillStyle = "#7a5cff"; circle(g, 8.6, 0, 1.7); g.fill();
    g.fillStyle = "#4a4f6a";
    g.beginPath(); g.moveTo(-6.4, 3); g.lineTo(-3.2, 3); g.lineTo(-4.1, 9); g.lineTo(-7.3, 9); g.closePath(); g.fill();
    g.strokeStyle = "#93a1bb"; g.lineWidth = 2.1; g.lineCap = "round";
    g.beginPath(); g.moveTo(-1.6, -6); g.lineTo(5.2, -6); g.stroke();
  }
  g.restore();
}

function drawMonster(g, m) {
  const def = m.def;
  const x = m.x, y = m.y;
  const t = m.t;
  const bob = Math.sin(t * 3 + 1) * 4;
  let sc = m.size || 1;
  let alpha = 1;
  if (m.state === "dying") {
    const k = clamp(m.t / 0.45, 0, 1);
    sc *= 1 + k * 0.4;
    alpha = 1 - k;
  }

  g.save();
  g.globalAlpha = alpha;
  g.translate(x, y + bob);
  g.scale(sc, sc);

  const col = def.color, dk = shade(col, -38), lt = shade(col, 28);

  // 柔和光环，保证任何背景配色下都能看清造型
  const halo = g.createRadialGradient(0, 2, 26, 0, 2, 82);
  halo.addColorStop(0, "rgba(46,30,78,.17)");
  halo.addColorStop(0.65, "rgba(46,30,78,.09)");
  halo.addColorStop(1, "rgba(46,30,78,0)");
  g.fillStyle = halo;
  circle(g, 0, 2, 82);
  g.fill();

  if (def.style === "horn" || def.style === "flame" || def.style === "blob") {
    // ---- 地面圆滚滚小怪兽 ----
    // 脚
    g.fillStyle = dk;
    rr(g, -26, 28, 17, 15, 7); g.fill();
    rr(g, 9, 28, 17, 15, 7); g.fill();
    // 尾巴
    g.strokeStyle = dk; g.lineWidth = 6; g.lineCap = "round";
    g.beginPath();
    g.moveTo(-31, 8);
    g.quadraticCurveTo(-46, 4 + Math.sin(t * 5) * 6, -42, -14 + Math.sin(t * 5) * 5);
    g.stroke();
    // 身体
    const gr = g.createRadialGradient(-10, -14, 6, 0, 6, 46);
    gr.addColorStop(0, lt); gr.addColorStop(0.62, col); gr.addColorStop(1, dk);
    g.fillStyle = gr;
    g.beginPath(); g.ellipse(0, 6, 34, 33, 0, 0, Math.PI * 2); g.fill();
    // 肚皮
    g.fillStyle = "rgba(255,255,255,.4)";
    g.beginPath(); g.ellipse(0, 14, 20, 17, 0, 0, Math.PI * 2); g.fill();

    if (def.style === "horn") {
      // 头顶电光角
      g.fillStyle = "#ffe066";
      g.beginPath();
      g.moveTo(-6, -24); g.lineTo(0, -52); g.lineTo(7, -24);
      g.closePath(); g.fill();
      g.strokeStyle = "#f0a800"; g.lineWidth = 2; g.stroke();
      // 电弧
      g.strokeStyle = "rgba(255,240,120,.9)"; g.lineWidth = 2.4;
      for (let i = 0; i < 2; i++) {
        const a = t * 6 + i * 3.1;
        g.beginPath();
        g.moveTo(0, -52);
        g.lineTo(Math.cos(a) * 12, -58 + Math.sin(a) * 7);
        g.lineTo(Math.cos(a + 0.9) * 17, -62 + Math.sin(a + 0.9) * 9);
        g.stroke();
      }
    } else if (def.style === "flame") {
      // 火焰头冠
      for (let i = 0; i < 5; i++) {
        const fx = -22 + i * 11;
        const fh = 20 + Math.sin(t * 7 + i) * 7;
        g.fillStyle = i % 2 ? "#ffd166" : "#ff8a3d";
        g.beginPath();
        g.moveTo(fx - 7, -22);
        g.quadraticCurveTo(fx - 5, -22 - fh * 0.7, fx, -22 - fh);
        g.quadraticCurveTo(fx + 6, -22 - fh * 0.6, fx + 7, -22);
        g.closePath(); g.fill();
      }
    } else {
      // 泡泡触角
      g.strokeStyle = dk; g.lineWidth = 3.5;
      g.beginPath(); g.moveTo(-10, -26); g.quadraticCurveTo(-14, -40, -6, -44); g.stroke();
      g.beginPath(); g.moveTo(8, -26); g.quadraticCurveTo(14, -40, 6, -46); g.stroke();
      g.fillStyle = "#ffe066";
      circle(g, -6, -45, 5); g.fill();
      circle(g, 6, -47, 5); g.fill();
    }

    // 眼睛
    const eyeY = -8;
    g.fillStyle = "#fff";
    g.beginPath(); g.ellipse(-12, eyeY, 10, 11, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(12, eyeY, 10, 11, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#26233a";
    circle(g, -10.5, eyeY + 1, 5.2); g.fill();
    circle(g, 13.5, eyeY + 1, 5.2); g.fill();
    g.fillStyle = "#fff";
    circle(g, -9, eyeY - 1.4, 2); g.fill();
    circle(g, 15, eyeY - 1.4, 2); g.fill();
    // 腮红
    g.fillStyle = "rgba(255,110,150,.35)";
    g.beginPath(); g.ellipse(-24, 6, 7, 4.5, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(24, 6, 7, 4.5, 0, 0, Math.PI * 2); g.fill();
    // 嘴（大笑）
    g.fillStyle = "#7a2c3a";
    g.beginPath();
    g.moveTo(-9, 8);
    g.quadraticCurveTo(0, 22, 9, 8);
    g.closePath(); g.fill();
    g.fillStyle = "#ff8fab";
    g.beginPath();
    g.moveTo(-5, 13);
    g.quadraticCurveTo(0, 18, 5, 13);
    g.closePath(); g.fill();
    // 小獠牙
    g.fillStyle = "#fff";
    g.beginPath(); g.moveTo(-8, 8); g.lineTo(-5, 8); g.lineTo(-6.5, 12.5); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(8, 8); g.lineTo(5, 8); g.lineTo(6.5, 12.5); g.closePath(); g.fill();

  } else if (def.style === "ufo") {
    // ---- 飞碟外星人 ----
    // 光柱
    g.save();
    g.globalAlpha = 0.16 + Math.sin(t * 4) * 0.06;
    g.fillStyle = "#9ff0ff";
    g.beginPath();
    g.moveTo(-18, 16); g.lineTo(-46, 78); g.lineTo(46, 78); g.lineTo(18, 16);
    g.closePath(); g.fill();
    g.restore();
    // 碟身
    const gr = g.createLinearGradient(0, -4, 0, 22);
    gr.addColorStop(0, lt); gr.addColorStop(0.5, col); gr.addColorStop(1, dk);
    g.fillStyle = gr;
    g.beginPath(); g.ellipse(0, 8, 46, 17, 0, 0, Math.PI * 2); g.fill();
    // 灯
    for (let i = 0; i < 7; i++) {
      const a = (i / 7) * Math.PI;
      const lx = Math.cos(Math.PI - a) * 38;
      const ly = 8 + Math.sin(Math.PI - a) * 9;
      const on = (Math.floor(t * 6) + i) % 3 === 0;
      g.fillStyle = on ? "#ffe066" : "rgba(255,255,255,.55)";
      circle(g, lx, ly, 3.4); g.fill();
    }
    // 驾驶舱
    const dome = g.createRadialGradient(-6, -16, 2, 0, -8, 26);
    dome.addColorStop(0, "rgba(230,255,255,.98)");
    dome.addColorStop(1, "rgba(120,220,255,.68)");
    g.fillStyle = dome;
    g.beginPath(); g.arc(0, 6, 24, Math.PI, Math.PI * 2); g.fill();
    g.fillStyle = "rgba(255,255,255,.7)";
    g.beginPath(); g.ellipse(-9, -6, 6, 8, -0.5, 0, Math.PI * 2); g.fill();
    // 外星人眼
    g.fillStyle = "#2b2350";
    g.beginPath(); g.ellipse(-7, 0, 5.5, 7.5, -0.15, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(7, 0, 5.5, 7.5, 0.15, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#9ff0ff";
    circle(g, -6, -1.5, 1.8); g.fill();
    circle(g, 8, -1.5, 1.8); g.fill();
    // 天线
    g.strokeStyle = "#93a1bb"; g.lineWidth = 2.4; g.lineCap = "round";
    g.beginPath(); g.moveTo(0, -17); g.lineTo(0, -30); g.stroke();
    g.fillStyle = "#ff5b8a";
    circle(g, 0, -33, 4.5); g.fill();
    g.globalAlpha = 0.35;
    circle(g, 0, -33, 8); g.fill();

  } else if (def.style === "tenta") {
    // ---- 触手外星人 ----
    g.strokeStyle = col; g.lineWidth = 9; g.lineCap = "round";
    for (let i = 0; i < 6; i++) {
      const a = -0.2 + (i / 5) * (Math.PI + 0.4);
      const sway = Math.sin(t * 3.4 + i * 1.2) * 10;
      g.beginPath();
      g.moveTo(Math.cos(a) * 26, Math.sin(a) * 14 + 12);
      g.quadraticCurveTo(
        Math.cos(a) * 40 + sway, Math.sin(a) * 22 + 34,
        Math.cos(a) * 34 - sway * 0.4, Math.sin(a) * 26 + 52
      );
      g.stroke();
    }
    g.strokeStyle = dk; g.lineWidth = 3;
    for (let i = 0; i < 6; i++) {
      const a = -0.2 + (i / 5) * (Math.PI + 0.4);
      const sway = Math.sin(t * 3.4 + i * 1.2) * 10;
      g.beginPath();
      g.moveTo(Math.cos(a) * 26, Math.sin(a) * 14 + 12);
      g.quadraticCurveTo(
        Math.cos(a) * 40 + sway, Math.sin(a) * 22 + 34,
        Math.cos(a) * 34 - sway * 0.4, Math.sin(a) * 26 + 52
      );
      g.stroke();
    }
    // 身体
    const gr = g.createRadialGradient(-12, -18, 5, 0, 0, 44);
    gr.addColorStop(0, lt); gr.addColorStop(0.6, col); gr.addColorStop(1, dk);
    g.fillStyle = gr;
    g.beginPath(); g.ellipse(0, 0, 38, 36, 0, 0, Math.PI * 2); g.fill();
    // 单只大眼
    g.fillStyle = "#fff";
    g.beginPath(); g.ellipse(0, -6, 20, 21, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#3a2fb0";
    circle(g, 0, -4, 11); g.fill();
    g.fillStyle = "#7fe9ff";
    circle(g, 0, -4, 6); g.fill();
    g.fillStyle = "#1a1440";
    circle(g, 0, -4, 3.2); g.fill();
    g.fillStyle = "rgba(255,255,255,.9)";
    circle(g, -4.5, -8.5, 3); g.fill();
    // 触角小灯
    for (let i = 0; i < 5; i++) {
      const a = Math.PI + (-0.7 + i * 0.35);
      g.fillStyle = i % 2 ? "#ffe066" : "#7fe9ff";
      circle(g, Math.cos(a) * 34, Math.sin(a) * 32, 3.6); g.fill();
    }

  } else if (def.style === "beast") {
    // ---- 银河巨兽 ----
    // 脚
    g.fillStyle = dk;
    rr(g, -34, 30, 24, 20, 9); g.fill();
    rr(g, 10, 30, 24, 20, 9); g.fill();
    // 身体
    const gr = g.createRadialGradient(-16, -22, 8, 0, 4, 56);
    gr.addColorStop(0, lt); gr.addColorStop(0.58, col); gr.addColorStop(1, dk);
    g.fillStyle = gr;
    g.beginPath(); g.ellipse(0, 2, 44, 40, 0, 0, Math.PI * 2); g.fill();
    // 胸口能量核
    g.fillStyle = "rgba(255,240,120,.28)";
    circle(g, 0, 18, 18); g.fill();
    const pulse = 0.7 + Math.sin(t * 5) * 0.3;
    g.fillStyle = `rgba(255,240,120,${pulse})`;
    circle(g, 0, 18, 10); g.fill();
    g.fillStyle = "#fff";
    circle(g, 0, 18, 5); g.fill();
    // 背刺
    g.fillStyle = "#ffd166";
    for (let i = 0; i < 4; i++) {
      const bx = -34 + i * 7;
      const by = -30 + i * 4;
      g.beginPath();
      g.moveTo(bx, by); g.lineTo(bx - 6, by - 16 - i * 2); g.lineTo(bx + 5, by - 4);
      g.closePath(); g.fill();
    }
    // 头角
    g.fillStyle = "#ffe066";
    g.beginPath(); g.moveTo(-26, -28); g.lineTo(-34, -52); g.lineTo(-16, -34); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(26, -28); g.lineTo(34, -52); g.lineTo(16, -34); g.closePath(); g.fill();
    // 眼
    g.fillStyle = "#fff";
    g.beginPath(); g.ellipse(-15, -8, 11, 12, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(15, -8, 11, 12, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#3a1020";
    circle(g, -13.5, -7, 5.6); g.fill();
    circle(g, 16.5, -7, 5.6); g.fill();
    g.fillStyle = "#ff8fab";
    circle(g, -13.5, -7, 2.4); g.fill();
    circle(g, 16.5, -7, 2.4); g.fill();
    g.fillStyle = "#fff";
    circle(g, -12, -9.4, 2.2); g.fill();
    circle(g, 18, -9.4, 2.2); g.fill();
    // 嘴
    g.fillStyle = "#4d1024";
    g.beginPath();
    g.moveTo(-14, 4); g.quadraticCurveTo(0, 20, 14, 4);
    g.closePath(); g.fill();
    g.fillStyle = "#fff";
    for (let i = 0; i < 4; i++) {
      const tx = -11 + i * 7.4;
      g.beginPath(); g.moveTo(tx, 4); g.lineTo(tx + 4.4, 4); g.lineTo(tx + 2.2, 9.5); g.closePath(); g.fill();
    }

  } else {
    // ---- 暗影巨人 ----
    g.fillStyle = "rgba(90,60,200,.18)";
    circle(g, 0, 0, 62); g.fill();
    const gr = g.createRadialGradient(-14, -20, 6, 0, 2, 54);
    gr.addColorStop(0, lt); gr.addColorStop(0.55, col); gr.addColorStop(1, dk);
    g.fillStyle = gr;
    // 梯形身体
    g.beginPath();
    g.moveTo(-30, -36); g.lineTo(30, -36); g.lineTo(42, 38); g.lineTo(-42, 38);
    g.closePath(); g.fill();
    // 肩甲
    g.fillStyle = shade(col, -18);
    rr(g, -52, -36, 24, 22, 9); g.fill();
    rr(g, 28, -36, 24, 22, 9); g.fill();
    // 头
    g.fillStyle = shade(col, 6);
    rr(g, -22, -66, 44, 34, 15); g.fill();
    // 眼（发光横条）
    const gl = 0.6 + Math.sin(t * 4) * 0.4;
    g.fillStyle = `rgba(120,255,240,${gl})`;
    rr(g, -16, -54, 12, 7, 3.5); g.fill();
    rr(g, 4, -54, 12, 7, 3.5); g.fill();
    g.fillStyle = `rgba(120,255,240,${gl * 0.3})`;
    circle(g, -10, -50, 14); g.fill();
    circle(g, 10, -50, 14); g.fill();
    // 胸口核心
    g.fillStyle = "rgba(120,255,240,.25)";
    circle(g, 0, 6, 16); g.fill();
    g.fillStyle = `rgba(120,255,240,${gl})`;
    star(g, 0, 6, 10, 4, 0.4); g.fill();
    // 纹路
    g.strokeStyle = `rgba(160,255,240,${gl * 0.5})`;
    g.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      g.beginPath();
      g.moveTo(-34 + i * 4, -20 + i * 16);
      g.lineTo(34 - i * 4, -20 + i * 16);
      g.stroke();
    }
  }

  g.restore();

  /* ---- 受击白闪 ---- */
  if (m.flash > 0) {
    g.save();
    g.globalAlpha = Math.min(0.8, m.flash * 5);
    g.globalCompositeOperation = "lighter";
    g.fillStyle = "#ffffff";
    g.beginPath();
    g.ellipse(x, y + bob, 52 * sc, 52 * sc, 0, 0, Math.PI * 2);
    g.fill();
    g.restore();
  }
}

/* ==================================================================
   7. 画布与常量
   ================================================================== */
const canvas = $("#gameCanvas");
const ctx = canvas.getContext("2d");
const W = 960, H = 540, GROUND_Y = 428;

function fitCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineJoin = "round";
}
fitCanvas();
window.addEventListener("resize", fitCanvas);

/* ==================================================================
   8. 游戏状态
   ================================================================== */
const G = {
  state: "menu",
  t: 0,
  dist: 0,
  stage: 1,
  speed: 330,
  scrollX: 0,
  energy: 0,
  hearts: 3,
  maxHearts: 3,
  weapons: { sword: 0, gun: 0, cannon: 0 },
  mods: { energyMul: 1, jumpMul: 1, speedMul: 1, wdur: 0, invulnMul: 1 },
  player: { x: 230, y: GROUND_Y, vy: 0, onGround: true, sliding: false, runT: 0, invuln: 0, attackT: 0, hurtT: 0 },
  obstacles: [],
  pickups: [],
  particles: [],
  texts: [],
  monster: null,
  spawnT: 0,
  pickupT: 0,
  weaponT: 0,
  monsterT: 14,
  shake: 0,
  banner: null,
  hitStop: 0,
  killStreak: 0,
};

const keys = { left: false, right: false, up: false, down: false };
let paused = false;

/* ---------- 粒子 / 文字 ---------- */
function burst(x, y, n, colors, opts) {
  opts = opts || {};
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2);
    const sp = rand(opts.minSp || 60, opts.maxSp || 320);
    const life = rand(0.35, 0.9) * (opts.life || 1);
    G.particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - (opts.lift || 60),
      life, max: life,
      size: rand(2.6, 6.6) * (opts.size || 1),
      color: colors[(Math.random() * colors.length) | 0],
      grav: opts.grav === undefined ? 900 : opts.grav,
      shape: opts.shape || "rect",
      rot: rand(0, 6.28),
      vrot: rand(-9, 9),
    });
  }
}
function floatText(text, x, y, color, size) {
  G.texts.push({ text, x, y, color: color || "#fff", size: size || 22, life: 1.1, max: 1.1, vy: -58 });
}

/* ==================================================================
   9. 开始 / 结束一局
   ================================================================== */
function startRun() {
  const cos = getCostume(save.equipped.costume);
  const acc = getAccessory(save.equipped.accessory);
  G.state = "play";
  G.t = 0; G.dist = 0; G.stage = 1; G.scrollX = 0; G.energy = 0;
  G.obstacles = []; G.pickups = []; G.particles = []; G.texts = [];
  G.monster = null; G.shake = 0; G.banner = null; G.hitStop = 0; G.killStreak = 0;

  G.mods.energyMul = (cos.energy || 1) * (acc.energy || 1);
  G.mods.jumpMul = (cos.jump || 1) * (acc.jump || 1);
  G.mods.speedMul = acc.speed || 1;
  G.mods.wdur = (cos.wdur || 0);
  G.mods.invulnMul = cos.invuln || 1;

  G.maxHearts = 3 + (cos.hearts || 0) + (acc.hearts || 0);
  G.hearts = G.maxHearts;

  G.weapons = { sword: 0, gun: 0, cannon: 0 };
  WEAPONS.forEach((w) => {
    if (save.owned.weapons.indexOf(w.id) >= 0) G.weapons[w.id] = w.dur + G.mods.wdur;
  });

  // 如果没有买剑（理论上不会），给一点保底
  if (G.weapons.sword <= 0 && !save.owned.weapons.length) G.weapons.sword = 6;

  const p = G.player;
  p.x = 230; p.y = GROUND_Y; p.vy = 0; p.onGround = true;
  p.sliding = false; p.runT = 0; p.invuln = 0; p.attackT = 0; p.hurtT = 0;

  G.speed = 330 * G.mods.speedMul;
  G.spawnT = 2.4;
  G.pickupT = 1.2;
  G.weaponT = 7.5;
  G.monsterT = 12;

  paused = false;
  $("#pauseOverlay").classList.remove("on");
  showScreen("play");
  hudCache = "";
  syncHUD();
  banner("出发！", "躲开障碍，击败怪兽", 1.6);
  Sound.stageUp();
}

function endRun(reason) {
  if (G.state !== "play") return;
  G.state = "over";
  Sound.over();
  const gain = Math.round(G.energy);
  save.energy += gain;
  if (G.dist > save.best) save.best = Math.floor(G.dist);
  if (G.stage > save.bestStage) save.bestStage = G.stage;
  persist();

  $("#overReason").textContent = reason;
  $("#overDist").textContent = Math.floor(G.dist) + " m";
  $("#overStage").textContent = "第 " + G.stage + " 关";
  $("#overEnergy").textContent = gain;
  $("#overGain").textContent = gain > 0 ? `能量已存入更衣室，共 ${save.energy} 能量` : "本局没有获得能量";
  $("#overTitle").textContent = G.stage >= 5 ? "很了不起！" : "挑战结束";

  showScreen("over");
  refreshMenuStats();
}

/* ==================================================================
   10. 关卡
   ================================================================== */
function nextStage(st) {
  G.stage = st;
  const bonus = 60 + st * 15;
  G.energy += bonus;
  banner(`第 ${st - 1} 关 通过！`, `能量 +${Math.round(bonus * G.mods.energyMul)}`, 1.9);
  Sound.stageUp();
  // 补给：新敌种前一定送到
  let type;
  if (st === 3) type = "gun";
  else if (st === 5 || st === 7) type = "cannon";
  else {
    // 补最缺的那一种
    let low = "sword", lowRatio = 9;
    for (const w of WEAPONS) {
      if (save.owned.weapons.indexOf(w.id) < 0) continue;
      const r = G.weapons[w.id] / (w.dur + G.mods.wdur);
      if (r < lowRatio) { lowRatio = r; low = w.id; }
    }
    type = low;
  }
  const wDef = getWeapon(type);
  const cap = (wDef.dur + G.mods.wdur) * 2;
  const amt = Math.max(0, Math.min(type === "cannon" ? 5 : 4, cap - G.weapons[type]));
  G.weapons[type] += amt;
  setTimeout(() => {
    if (G.state === "play") floatText(`补给 ${getWeapon(type).name} +${amt}`, W / 2, 190, getWeapon(type).color, 26);
  }, 500);
}

function banner(text, sub, dur) {
  G.banner = { text, sub, t: 0, dur: dur || 1.8 };
}

/* ==================================================================
   11. 生成物
   ================================================================== */
function spawnObstacle() {
  const st = G.stage;
  const p = G.player;
  const types = ["box", "box", "bar", "spike"];
  if (st >= 2) types.push("saw");
  if (st >= 3) types.push("bomb");
  if (st >= 4) types.push("double");
  const type = pick(types);
  const X = W + 80;

  if (type === "box") {
    G.obstacles.push({ type: "box", x: X, y: GROUND_Y - 56, w: 52, h: 56, hue: 0 });
  } else if (type === "double") {
    G.obstacles.push({ type: "box", x: X, y: GROUND_Y - 52, w: 46, h: 52, hue: 1 });
    G.obstacles.push({ type: "box", x: X + 78, y: GROUND_Y - 52, w: 46, h: 52, hue: 1 });
  } else if (type === "bar") {
    // 低空电网：上方禁行，必须滑铲通过
    G.obstacles.push({ type: "bar", x: X, y: 238, w: 88, h: 144, beamY: 348, beamH: 34 });
  } else if (type === "spike") {
    G.obstacles.push({ type: "spike", x: X, y: GROUND_Y - 30, w: 96, h: 30 });
  } else if (type === "saw") {
    G.obstacles.push({ type: "saw", x: X, y: GROUND_Y - 62, w: 62, h: 62, rot: 0 });
  } else if (type === "bomb") {
    G.obstacles.push({ type: "bomb", x: clamp(p.x + rand(-70, 150), 120, 800), y: -70, w: 46, h: 46, vy: 90, t: 0 });
  }
}

function spawnPickup() {
  const r = Math.random();
  if (r < 0.8) {
    // 能量球
    const hChoice = pick([0, 1, 1, 2]);
    const y = hChoice === 0 ? GROUND_Y - 46 : hChoice === 1 ? GROUND_Y - 118 : GROUND_Y - 176;
    G.pickups.push({ kind: "energy", x: W + 50, y, w: 34, h: 34, bob: rand(0, 6.28) });
  } else {
    // 武器箱
    const owned = save.owned.weapons;
    let pool = ["sword"];
    if (G.stage >= 2) pool.push("gun");
    if (G.stage >= 4) pool.push("cannon");
    if (owned.indexOf("gun") >= 0) pool.push("gun");
    if (owned.indexOf("cannon") >= 0) pool.push("cannon");
    const type = pick(pool);
    G.pickups.push({ kind: "weapon", weapon: type, x: W + 60, y: GROUND_Y - 120, w: 46, h: 46, bob: rand(0, 6.28) });
  }
}

function spawnMonster() {
  const pool = MONSTERS.filter((m) => m.from <= G.stage);
  // 优先保证有变化：避免连续同一种
  const lastId = G.lastMonsterId;
  let cands = pool.filter((m) => m.id !== lastId);
  if (!cands.length) cands = pool;
  const def = pick(cands);
  G.lastMonsterId = def.id;

  const need = def.need;
  const hpBonus = def.kind === "boss" ? Math.floor((G.stage - def.from) / 3) : Math.floor((G.stage - def.from) / 2);
  const hp = def.hp + clamp(hpBonus, 0, 3);
  const isBoss = def.kind === "boss";
  const size = isBoss ? 1.18 : def.kind === "flyer" ? 1.08 : 1.02;
  const py = def.kind === "ground" ? GROUND_Y - 44 : 268;

  const m = {
    def,
    hp,
    maxHp: hp,
    need,
    x: W + 160,
    y: py - 40,
    baseY: py,
    fromX: W + 160,
    fromY: py - 60,
    toX: clamp(G.player.x + 250, 470, 720),
    t: 0,
    state: "enter",
    flash: 0,
    size,
    timer: 0,
    fightTime: Math.max(3.0, 5.8 - G.stage * 0.28),
    doomed: G.weapons[need] <= 0,
    bobK: rand(0, 6.28),
  };
  G.monster = m;
  Sound.beep(180, 0.5, "sawtooth", 0.08, 90);

  if (m.doomed) {
    banner("危险！", `没有能对付它的武器`, 1.8);
  } else {
    banner(`${def.name} 出现！`, `用【${getWeapon(need).name}】击打它`, 1.8);
  }
  syncHUD();
}

/* ==================================================================
   12. 更新
   ================================================================== */
function update(dt) {
  const p = G.player;
  G.t += dt;

  G.speed = (330 + (G.stage - 1) * 24) * G.mods.speedMul;
  G.speed = Math.min(G.speed, 580 * G.mods.speedMul);
  G.scrollX += G.speed * dt;
  G.dist += (G.speed * dt) / 9;

  // 关卡推进
  const st = Math.floor(G.dist / 700) + 1;
  if (st > G.stage) nextStage(st);

  /* ---- 玩家 ---- */
  let dx = 0;
  if (keys.left) dx -= 1;
  if (keys.right) dx += 1;
  if (dx !== 0) p.x += dx * 340 * dt;
  p.x = clamp(p.x, 96, 700);

  if (keys.up && p.onGround) {
    p.onGround = false;
    p.sliding = false;
    p.vy = -800 * G.mods.jumpMul;
    Sound.jump();
    burst(p.x, p.y, 7, ["#ffffff", "#d7ecff"], { maxSp: 130, lift: 20, grav: 500, size: 0.8 });
  }

  if (!p.onGround) {
    p.vy += 2000 * dt;
    p.y += p.vy * dt;
    if (p.y >= GROUND_Y) {
      p.y = GROUND_Y;
      p.vy = 0;
      p.onGround = true;
      Sound.land();
      burst(p.x, GROUND_Y, 6, ["#ffffff", "#e5eefc"], { maxSp: 110, lift: 30, grav: 700, size: 0.75 });
    }
  }

  p.sliding = keys.down && p.onGround;
  p.runT += dt * (p.onGround ? (p.sliding ? 6 : 13) : 5);
  if (p.sliding) {
    // 滑铲扬尘
    if (Math.random() < 0.5) {
      G.particles.push({
        x: p.x - 20, y: GROUND_Y - 2, vx: rand(-160, -60), vy: rand(-70, -10),
        life: 0.45, max: 0.45, size: rand(2.5, 5), color: "#ffffff", grav: 40, shape: "circle",
        rot: 0, vrot: 0,
      });
    }
  }

  p.invuln = Math.max(0, p.invuln - dt);
  p.attackT = Math.max(0, p.attackT - dt);
  p.hurtT = Math.max(0, p.hurtT - dt);
  G.shake = Math.max(0, G.shake - dt * 60);

  /* ---- 障碍 ---- */
  for (let i = G.obstacles.length - 1; i >= 0; i--) {
    const o = G.obstacles[i];
    if (o.type === "bomb") {
      o.vy += 1250 * dt;
      o.y += o.vy * dt;
      o.t += dt;
      if (o.y > GROUND_Y - o.h) { o.y = GROUND_Y - o.h; o.vy = 0; }
      if (o.t > 2.2) {
        // 爆炸消散
        burst(o.x + o.w / 2, GROUND_Y - 10, 16, ["#ffc53d", "#ff7a2f", "#ffffff"], { maxSp: 340, lift: 90 });
        G.obstacles.splice(i, 1);
        continue;
      }
    } else {
      o.x -= G.speed * dt;
    }
    if (o.type === "saw") o.rot += dt * 12;
    if (o.x < -180) { G.obstacles.splice(i, 1); continue; }

    // 碰撞
    if (p.invuln <= 0) {
      const active = o.type === "bomb" ? o.t <= 2.2 : true;
      if (active) {
        const hb = playerBox();
        if (aabb(hb, o)) {
          hurtPlayer("撞到了障碍，摔了个大跟头");
          if (G.state !== "play") return;
        }
      }
    }
  }

  /* ---- 拾取物 ---- */
  for (let i = G.pickups.length - 1; i >= 0; i--) {
    const k = G.pickups[i];
    k.x -= G.speed * dt;
    k.bob += dt * 4;
    if (k.x < -80) { G.pickups.splice(i, 1); continue; }
    const hb = playerBox();
    if (hb.x < k.x + k.w / 2 && hb.x + hb.w > k.x - k.w / 2 && hb.y < k.y + k.h / 2 && hb.y + hb.h > k.y - k.h / 2) {
      collect(k);
      G.pickups.splice(i, 1);
    }
  }

  /* ---- 怪兽 ---- */
  updateMonster(dt);

  /* ---- 生成 ---- */
  if (!G.monster) {
    G.spawnT -= dt;
    if (G.spawnT <= 0) {
      spawnObstacle();
      const base = Math.max(0.72, 1.04 - (G.stage - 1) * 0.03);
      G.spawnT = base + Math.random() * 0.5;
    }
  }
  G.pickupT -= dt;
  if (G.pickupT <= 0) {
    spawnPickup();
    G.pickupT = rand(1.7, 3.2);
  }
  G.weaponT -= dt;
  if (G.weaponT <= 0) {
    // 只在库存偏低时投放补给，避免武器过剩
    const need = [];
    if (G.weapons.sword <= 4) need.push("sword");
    if (G.stage >= 2 && G.weapons.gun <= 3) need.push("gun");
    if (G.stage >= 4 && G.weapons.cannon <= 1) need.push("cannon");
    if (need.length) {
      G.pickups.push({ kind: "weapon", weapon: pick(need), x: W + 60, y: GROUND_Y - 110, w: 46, h: 46, bob: 0 });
      G.weaponT = rand(11, 16);
    } else {
      G.weaponT = 3.5;
    }
  }

  if (!G.monster) {
    G.monsterT -= dt;
    if (G.monsterT <= 0) {
      spawnMonster();
      G.monsterT = Math.max(6.5, 14 - G.stage * 0.7) + rand(0, 2);
    }
  }

  /* ---- 粒子/文字 ---- */
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const pt = G.particles[i];
    pt.life -= dt;
    if (pt.life <= 0) { G.particles.splice(i, 1); continue; }
    pt.vy += (pt.grav || 900) * dt;
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.rot += pt.vrot * dt;
  }
  for (let i = G.texts.length - 1; i >= 0; i--) {
    const tx = G.texts[i];
    tx.life -= dt;
    tx.y += tx.vy * dt;
    tx.vy *= 0.94;
    if (tx.life <= 0) G.texts.splice(i, 1);
  }
  if (G.banner) {
    G.banner.t += dt;
    if (G.banner.t > G.banner.dur) G.banner = null;
  }

  syncHUD();
}

function playerBox() {
  const p = G.player;
  const h = p.sliding ? 36 : 84;
  return { x: p.x - 17, y: p.y - h + 5, w: 34, h: h - 5 };
}
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function collect(k) {
  const p = G.player;
  if (k.kind === "energy") {
    const v = Math.round(7 * G.mods.energyMul);
    G.energy += v;
    Sound.coin();
    burst(k.x, k.y, 8, ["#ffe066", "#ffb800", "#ffffff"], { maxSp: 160, life: 0.7, grav: 300 });
    floatText("+" + v, k.x, k.y - 12, "#ffd166", 17);
  } else {
    const w = getWeapon(k.weapon);
    const amt = k.weapon === "cannon" ? 1 : 3;
    const cap = (w.dur + G.mods.wdur) * 2;
    const real = Math.max(0, Math.min(amt, cap - G.weapons[k.weapon]));
    G.weapons[k.weapon] += real;
    Sound.gift();
    burst(k.x, k.y, 14, [w.color, "#ffffff"], { maxSp: 240, life: 0.9, grav: 400 });
    floatText(`${w.name} +${amt}`, k.x, k.y - 14, w.color, 19);
    banner("补给到手", `${w.name} 耐久 +${amt}`, 1.2);
  }
  hudCache = "";
  syncHUD();
}

function hurtPlayer(reason) {
  const p = G.player;
  if (p.invuln > 0) return;
  G.hearts--;
  p.invuln = 1.3 * G.mods.invulnMul;
  p.hurtT = 0.45;
  G.shake = 16;
  Sound.hurt();
  burst(p.x, p.y - 40, 16, ["#ff5b8a", "#ffffff", "#ffd166"], { maxSp: 300, life: 0.8 });
  floatText("-1", p.x, p.y - 80, "#ff5b8a", 26);
  hudCache = "";
  syncHUD();
  if (G.hearts <= 0) {
    endRun(reason);
  }
}

/* ---------- 怪兽逻辑 ---------- */
function updateMonster(dt) {
  const m = G.monster;
  if (!m) return;
  m.t += dt;
  m.flash = Math.max(0, m.flash - dt);

  if (m.state === "enter") {
    const k = Math.min(1, m.t / 0.85);
    const e = easeOut(k);
    m.x = lerp(m.fromX, m.toX, e);
    m.y = lerp(m.fromY, m.baseY, e);
    if (k >= 1) {
      m.state = m.doomed ? "doomed" : "fight";
      m.t = 0;
      m.timer = m.fightTime;
      if (m.doomed) {
        banner("没有武器！", `被 ${m.def.name} 击倒了`, 1.4);
      }
    }
    return;
  }

  if (m.state === "fight") {
    // 悬浮
    m.y = m.baseY + Math.sin(m.t * 2.6 + m.bobK) * 7;
    m.x = m.toX + Math.sin(m.t * 1.4 + m.bobK) * 1.5;

    m.timer -= dt;
    if (m.timer <= 0) {
      m.state = "attack";
      m.t = 0;
      G.shake = 22;
      Sound.boom();
      // 冲过来
      return;
    }
    // 武器耗尽 -> 注定失败
    if (G.weapons[m.need] <= 0) {
      m.doomed = true;
      m.state = "doomed";
      m.t = 0;
      banner("武器用光了！", `被 ${m.def.name} 击倒了`, 1.6);
    }
    return;
  }

  if (m.state === "doomed") {
    m.y = m.baseY + Math.sin(m.t * 2.6) * 7;
    if (m.t > 1.0) {
      // 冲撞
      const k = Math.min(1, (m.t - 1.0) / 0.5);
      m.x = lerp(m.toX, G.player.x, easeOut(k));
      m.y = lerp(m.baseY, G.player.y - 50, easeOut(k));
      if (k >= 1) {
        burst(G.player.x, G.player.y - 40, 28, ["#ff5b8a", "#ffffff", "#ffd166", "#ff7a2f"], { maxSp: 420, life: 1.1 });
        G.shake = 26;
        Sound.boom();
        endRun(`没有【${getWeapon(m.need).name}】，被${m.def.name}击倒了`);
      }
    }
    return;
  }

  if (m.state === "attack") {
    const k = Math.min(1, m.t / 0.45);
    m.x = lerp(m.toX, G.player.x + 30, easeOut(k));
    m.y = lerp(m.baseY, G.player.y - 56, easeOut(k));
    if (k >= 1) {
      burst(G.player.x, G.player.y - 40, 26, ["#ff5b8a", "#ffffff", "#ffd166"], { maxSp: 400, life: 1 });
      G.shake = 24;
      endRun(`没能及时击倒${m.def.name}`);
    }
    return;
  }

  if (m.state === "dying") {
    m.t += dt;
    if (m.t > 0.45) {
      G.monster = null;
      G.spawnT = Math.max(G.spawnT, 0.7);
      hudCache = "";
      syncHUD();
    }
    return;
  }
}

/* ---------- 击打 ---------- */
function attack() {
  if (G.state !== "play" || paused) return;
  const p = G.player;
  if (p.attackT > 0.06) return;
  p.attackT = 0.24;
  Sound.slash();

  const m = G.monster;
  if (!m || m.state !== "fight") {
    // 空挥
    G.particles.push({
      x: p.x + 26, y: p.y - 44, vx: 180, vy: -20, life: 0.22, max: 0.22,
      size: 4, color: "rgba(255,255,255,.9)", grav: 0, shape: "circle", rot: 0, vrot: 0,
    });
    return;
  }

  const need = m.need;
  if (G.weapons[need] <= 0) return;

  G.weapons[need]--;
  m.hp--;
  m.flash = 0.2;
  G.shake = 7;
  Sound.hit();
  burst(m.x, m.y, 12, ["#ffffff", "#ffe066", getWeapon(need).color], { maxSp: 300, life: 0.6 });
  floatText("-1", m.x, m.y - 60 * m.size, "#ff5b8a", 24);

  hudCache = "";

  if (m.hp <= 0) {
    defeatMonster(m);
  } else if (G.weapons[need] <= 0) {
    m.doomed = true;
    m.state = "doomed";
    m.t = 0;
    banner("武器报废了！", `没有【${getWeapon(need).name}】了`, 1.5);
  }
  syncHUD();
}

function defeatMonster(m) {
  m.state = "dying";
  m.t = 0;
  G.killStreak++;
  const pts = Math.round(m.def.pts * (1 + (G.stage - 1) * 0.12) * G.mods.energyMul);
  G.energy += pts;
  G.shake = 18;
  Sound.boom();
  burst(m.x, m.y, 34, ["#ffe066", "#ff8fab", "#7fe9ff", "#ffffff", m.def.color], { maxSp: 460, life: 1.2, size: 1.15 });
  floatText("+" + pts + " 能量", m.x, m.y - 50, "#ffd166", 26);
  floatText("击破！", m.x, m.y - 90, "#ffffff", 30);
  banner(`${m.def.name} 被击破`, `能量 +${pts}`, 1.4);

  // 击破奖励：小概率掉武器
  if (Math.random() < 0.4) {
    const t = pick(["sword", "gun", "cannon"].filter((k) => k !== "sword" || G.weapons.sword < 4));
    const w0 = getWeapon(t);
    const cap = (w0.dur + G.mods.wdur) * 2;
    const amt = Math.max(0, Math.min(t === "cannon" ? 1 : 2, cap - G.weapons[t]));
    if (amt > 0) {
      G.weapons[t] += amt;
      floatText(`${w0.name} +${amt}`, m.x, m.y - 130, w0.color, 18);
    }
  }
  hudCache = "";
  syncHUD();
}

/* ==================================================================
   13. 渲染
   ================================================================== */
function drawBackground() {
  const pal = PALETTES[(G.stage - 1) % PALETTES.length];

  // 天空
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y + 40);
  sky.addColorStop(0, pal.sky[0]);
  sky.addColorStop(1, pal.sky[1]);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, GROUND_Y + 4);

  // 太阳
  ctx.save();
  ctx.translate(806, 92);
  const sg = ctx.createRadialGradient(0, 0, 8, 0, 0, 92);
  sg.addColorStop(0, "rgba(255,244,190,.5)");
  sg.addColorStop(1, "rgba(255,244,190,0)");
  ctx.fillStyle = sg;
  circle(ctx, 0, 0, 92); ctx.fill();
  ctx.fillStyle = "rgba(255,236,150,.55)";
  for (let i = 0; i < 10; i++) {
    ctx.save();
    ctx.rotate(i * (Math.PI / 5) + G.t * 0.12);
    rr(ctx, -3.5, -60, 7, 15, 3.5);
    ctx.fill();
    ctx.restore();
  }
  const cg = ctx.createRadialGradient(-11, -13, 3, 0, 0, 34);
  cg.addColorStop(0, "#fffdf0");
  cg.addColorStop(1, "#ffe066");
  ctx.fillStyle = cg;
  circle(ctx, 0, 0, 31); ctx.fill();
  ctx.restore();

  // 云
  const co = (G.scrollX * 0.07) % 1600;
  for (let i = 0; i < 6; i++) {
    let x = ((i * 268 + 90 - co) % 1600 + 1600) % 1600 - 240;
    drawCloud(x, 54 + hash(i * 3.7) * 96, 0.62 + hash(i * 9.1) * 0.62);
  }

  // 远山
  ctx.fillStyle = pal.hill;
  const ho = (G.scrollX * 0.14) % 420;
  for (let i = -1; i < 4; i++) {
    const x = i * 420 - ho;
    ctx.beginPath();
    ctx.moveTo(x - 40, GROUND_Y);
    ctx.quadraticCurveTo(x + 110, GROUND_Y - 150 - hash(i + 3) * 60, x + 260, GROUND_Y);
    ctx.quadraticCurveTo(x + 330, GROUND_Y - 80 - hash(i + 8) * 50, x + 470, GROUND_Y);
    ctx.closePath();
    ctx.fill();
  }

  // 远建筑
  drawSkyline((G.scrollX * 0.26) % 200, GROUND_Y - 18, pal.far, 0.62, 0);
  drawSkyline((G.scrollX * 0.5) % 260, GROUND_Y - 4, pal.near, 0.95, 1);

  // 地面
  const gg = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  gg.addColorStop(0, pal.ground);
  gg.addColorStop(1, shade(pal.ground2, -14));
  ctx.fillStyle = gg;
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

  // 地面高光
  ctx.fillStyle = "rgba(255,255,255,.45)";
  ctx.fillRect(0, GROUND_Y, W, 4);
  ctx.fillStyle = "rgba(60,80,60,.1)";
  ctx.fillRect(0, GROUND_Y + 4, W, 3);

  // 跑道条纹
  const so = G.scrollX % 96;
  ctx.fillStyle = "rgba(255,255,255,.34)";
  for (let i = -1; i < W / 96 + 2; i++) {
    ctx.fillRect(i * 96 - so, GROUND_Y + 20, 48, 9);
    ctx.fillRect(i * 96 - so + 24, GROUND_Y + 56, 34, 7);
  }
}

function drawCloud(x, y, s) {
  ctx.fillStyle = "rgba(255,255,255,.9)";
  ctx.beginPath();
  ctx.arc(x, y, 26 * s, 0, Math.PI * 2);
  ctx.arc(x + 30 * s, y - 11 * s, 33 * s, 0, Math.PI * 2);
  ctx.arc(x + 64 * s, y + 3 * s, 24 * s, 0, Math.PI * 2);
  ctx.arc(x + 33 * s, y + 13 * s, 26 * s, 0, Math.PI * 2);
  ctx.fill();
}

function drawSkyline(scroll, baseY, color, hMul, win) {
  const period = win ? 132 : 108;
  const start = Math.floor(scroll / period) - 1;
  const count = Math.ceil(W / period) + 3;
  for (let i = start; i < start + count; i++) {
    const x = i * period - scroll;
    const r1 = hash(i * 3.13 + 1.7);
    const r2 = hash(i * 7.77 + 4.2);
    const w = (win ? 64 : 54) + r1 * 46;
    const h = ((win ? 88 : 62) + r2 * 116) * hMul;
    ctx.fillStyle = r1 > 0.55 ? shade(color, -13) : r1 < 0.22 ? shade(color, 12) : color;
    rr(ctx, x, baseY - h, w, h + 60, 10);
    ctx.fill();
    // 屋顶装饰
    if (r1 > 0.6) {
      ctx.fillStyle = shade(color, 18);
      rr(ctx, x + w * 0.35, baseY - h - 16, w * 0.3, 18, 5);
      ctx.fill();
    }
    if (win) {
      ctx.fillStyle = "rgba(255,255,255,.42)";
      for (let wy = baseY - h + 16; wy < baseY - 14; wy += 26) {
        for (let wx = x + 12; wx < x + w - 16; wx += 22) {
          if (hash(i * 17 + wy * 0.7 + wx * 0.3) > 0.35) {
            rr(ctx, wx, wy, 10, 13, 3);
            ctx.fill();
          }
        }
      }
    }
  }
}

function drawObstacles() {
  for (const o of G.obstacles) {
    ctx.save();
    if (o.type === "box") {
      const g1 = ctx.createLinearGradient(o.x, o.y, o.x, o.y + o.h);
      g1.addColorStop(0, o.hue ? "#ffd166" : "#ffb27a");
      g1.addColorStop(1, o.hue ? "#e8a800" : "#e8855a");
      ctx.fillStyle = g1;
      rr(ctx, o.x, o.y, o.w, o.h, 9);
      ctx.fill();
      ctx.strokeStyle = "rgba(120,60,20,.28)";
      ctx.lineWidth = 2.5;
      rr(ctx, o.x, o.y, o.w, o.h, 9);
      ctx.stroke();
      // 木箱纹理
      ctx.strokeStyle = "rgba(255,255,255,.45)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(o.x + 8, o.y + o.h * 0.45);
      ctx.lineTo(o.x + o.w - 8, o.y + o.h * 0.45);
      ctx.moveTo(o.x + o.w / 2, o.y + 8);
      ctx.lineTo(o.x + o.w / 2, o.y + o.h * 0.42);
      ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.32)";
      rr(ctx, o.x + 7, o.y + 6, o.w - 14, 7, 4);
      ctx.fill();
    } else if (o.type === "bar") {
      const bx = o.x, bw = o.w;
      // 上方禁行能量场
      const fg = ctx.createLinearGradient(0, o.y, 0, o.beamY);
      fg.addColorStop(0, "rgba(255,80,125,.03)");
      fg.addColorStop(1, "rgba(255,80,125,.26)");
      ctx.fillStyle = fg;
      ctx.fillRect(bx, o.y, bw, o.beamY - o.y);
      ctx.save();
      ctx.beginPath();
      ctx.rect(bx, o.y, bw, o.beamY - o.y);
      ctx.clip();
      ctx.strokeStyle = "rgba(255,110,150,.5)";
      ctx.lineWidth = 1.6;
      const so2 = (G.t * 110) % 26;
      for (let y = o.y + so2 - 26; y < o.beamY; y += 26) {
        ctx.beginPath();
        ctx.moveTo(bx, y);
        ctx.lineTo(bx + bw, y);
        ctx.stroke();
      }
      // 下滑箭头提示
      ctx.fillStyle = "rgba(255,255,255,.5)";
      for (let i = 0; i < 2; i++) {
        const yy = o.beamY - 46 - i * 24;
        ctx.beginPath();
        ctx.moveTo(bx + bw / 2 - 11, yy);
        ctx.lineTo(bx + bw / 2 + 11, yy);
        ctx.lineTo(bx + bw / 2, yy + 12);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
      // 横梁本体
      const g2 = ctx.createLinearGradient(0, o.beamY, 0, o.beamY + o.beamH);
      g2.addColorStop(0, "#454b7a");
      g2.addColorStop(1, "#23263f");
      ctx.fillStyle = g2;
      rr(ctx, bx - 6, o.beamY, bw + 12, o.beamH, 10);
      ctx.fill();
      ctx.save();
      rr(ctx, bx - 6, o.beamY, bw + 12, o.beamH, 10);
      ctx.clip();
      ctx.fillStyle = "#ffc53d";
      for (let i = -1; i < 8; i++) {
        ctx.beginPath();
        ctx.moveTo(bx + i * 22, o.beamY + o.beamH);
        ctx.lineTo(bx + i * 22 + 10, o.beamY);
        ctx.lineTo(bx + i * 22 + 18, o.beamY);
        ctx.lineTo(bx + i * 22 + 8, o.beamY + o.beamH);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
      ctx.strokeStyle = "rgba(18,22,42,.55)";
      ctx.lineWidth = 2.2;
      rr(ctx, bx - 6, o.beamY, bw + 12, o.beamH, 10);
      ctx.stroke();
      // 两端发射器
      ctx.fillStyle = "#6b7396";
      rr(ctx, bx - 12, o.beamY - 5, 12, o.beamH + 10, 5); ctx.fill();
      rr(ctx, bx + bw, o.beamY - 5, 12, o.beamH + 10, 5); ctx.fill();
      ctx.fillStyle = "#ff5b8a";
      circle(ctx, bx - 6, o.beamY + o.beamH / 2, 3.2); ctx.fill();
      circle(ctx, bx + bw + 6, o.beamY + o.beamH / 2, 3.2); ctx.fill();
    } else if (o.type === "spike") {
      // 底板
      ctx.fillStyle = "#3a4066";
      rr(ctx, o.x - 4, GROUND_Y - 12, o.w + 8, 14, 6);
      ctx.fill();
      // 尖刺
      const n = 5;
      for (let i = 0; i < n; i++) {
        const sx = o.x + (i * o.w) / n;
        const gsp = ctx.createLinearGradient(sx, o.y, sx, GROUND_Y);
        gsp.addColorStop(0, "#ffffff");
        gsp.addColorStop(0.45, "#ff8fab");
        gsp.addColorStop(1, "#e03b6c");
        ctx.fillStyle = gsp;
        ctx.beginPath();
        ctx.moveTo(sx + 1, GROUND_Y - 10);
        ctx.lineTo(sx + o.w / n / 2, o.y - 6);
        ctx.lineTo(sx + o.w / n - 1, GROUND_Y - 10);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "rgba(120,20,50,.45)";
        ctx.lineWidth = 1.8;
        ctx.stroke();
      }
    } else if (o.type === "saw") {
      const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
      ctx.translate(cx, cy);
      ctx.rotate(o.rot);
      ctx.fillStyle = "#b8c4d6";
      star(ctx, 0, 0, o.w / 2, 9, 0.68);
      ctx.fill();
      ctx.strokeStyle = "#8d99b0";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = "#4a5580";
      circle(ctx, 0, 0, o.w * 0.19);
      ctx.fill();
      ctx.fillStyle = "#ff5b8a";
      circle(ctx, 0, 0, o.w * 0.09);
      ctx.fill();
    } else if (o.type === "bomb") {
      // 影子
      const groundY = GROUND_Y;
      const ratio = clamp((o.y + o.h) / groundY, 0, 1);
      ctx.globalAlpha = 0.28 * ratio;
      ctx.fillStyle = "#2b2d42";
      ctx.beginPath();
      ctx.ellipse(o.x + o.w / 2, groundY, 20 * ratio, 6 * ratio, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      // 陨石
      const g3 = ctx.createRadialGradient(o.x + o.w * 0.35, o.y + o.h * 0.3, 2, o.x + o.w / 2, o.y + o.h / 2, o.w * 0.7);
      g3.addColorStop(0, "#8c6b52");
      g3.addColorStop(0.6, "#5d4230");
      g3.addColorStop(1, "#3a2a20");
      ctx.fillStyle = g3;
      circle(ctx, o.x + o.w / 2, o.y + o.h / 2, o.w / 2);
      ctx.fill();
      // 火焰尾
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = "#ff9f43";
      ctx.beginPath();
      ctx.ellipse(o.x + o.w / 2, o.y + o.h / 2 - 14, 12, 18, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ffe066";
      ctx.beginPath();
      ctx.ellipse(o.x + o.w / 2, o.y + o.h / 2 - 10, 6, 11, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
}

function drawPickups() {
  for (const k of G.pickups) {
    const by = Math.sin(k.bob) * 6;
    ctx.save();
    ctx.translate(k.x, k.y + by);
    if (k.kind === "energy") {
      ctx.save();
      ctx.globalAlpha = 0.32;
      ctx.fillStyle = "#ffd166";
      circle(ctx, 0, 0, 22); ctx.fill();
      ctx.restore();
      const g1 = ctx.createRadialGradient(-5, -6, 2, 0, 0, 15);
      g1.addColorStop(0, "#fff9d6");
      g1.addColorStop(0.55, "#ffd166");
      g1.addColorStop(1, "#f0a800");
      ctx.fillStyle = g1;
      circle(ctx, 0, 0, 15); ctx.fill();
      ctx.fillStyle = "#8a5a00";
      ctx.beginPath();
      ctx.moveTo(2, -9); ctx.lineTo(-5, 1); ctx.lineTo(0, 1); ctx.lineTo(-1.5, 9);
      ctx.lineTo(5, -1); ctx.lineTo(0.5, -1); ctx.closePath();
      ctx.fill();
    } else {
      const w = getWeapon(k.weapon);
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = w.color;
      circle(ctx, 0, 0, 28); ctx.fill();
      ctx.restore();
      ctx.fillStyle = "rgba(255,255,255,.94)";
      rr(ctx, -21, -21, 42, 42, 13); ctx.fill();
      ctx.strokeStyle = w.color;
      ctx.lineWidth = 3;
      rr(ctx, -21, -21, 42, 42, 13); ctx.stroke();
      drawWeaponIcon(ctx, 0, 0, 30, k.weapon, w.color, 0);
      // 旋转的小星星
      const a = G.t * 2;
      ctx.fillStyle = w.color;
      for (let i = 0; i < 3; i++) {
        const ang = a + (i * Math.PI * 2) / 3;
        star(ctx, Math.cos(ang) * 28, Math.sin(ang) * 28, 4, 4, 0.4);
        ctx.fill();
      }
    }
    ctx.restore();
  }
}

function drawPlayer() {
  const p = G.player;
  if (p.invuln > 0 && Math.floor(G.t * 22) % 2 === 0) return;

  // 影子
  const airK = clamp(1 - (GROUND_Y - p.y) / 190, 0.15, 1);
  ctx.save();
  ctx.globalAlpha = 0.2 * airK;
  ctx.fillStyle = "#24304a";
  ctx.beginPath();
  ctx.ellipse(p.x, GROUND_Y + 3, 25 * airK, 7.5 * airK, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 受伤红光
  if (p.hurtT > 0) {
    ctx.save();
    ctx.globalAlpha = p.hurtT * 0.7;
    ctx.fillStyle = "#ff5b8a";
    circle(ctx, p.x, p.y - 40, 46);
    ctx.fill();
    ctx.restore();
  }

  drawSausage(ctx, p.x, p.y, 1.1, {
    costume: save.equipped.costume,
    accessory: save.equipped.accessory,
    phase: p.runT,
    sliding: p.sliding,
    airborne: !p.onGround,
    facing: 1,
  });

  // 手持武器
  if (p.attackT <= 0) {
    const m = G.monster;
    let type = null;
    if (m && m.state === "fight" && G.weapons[m.need] > 0) type = m.need;
    else if (G.weapons.sword > 0) type = "sword";
    else if (G.weapons.gun > 0) type = "gun";
    else if (G.weapons.cannon > 0) type = "cannon";
    if (type) {
      drawWeaponIcon(ctx, p.x + 26, p.y - (p.sliding ? 20 : 44), 24, type, getWeapon(type).color, -0.5 + Math.sin(p.runT) * 0.08);
    }
  }

  // 挥击特效
  if (p.attackT > 0) {
    const k = 1 - p.attackT / 0.24;
    const m = G.monster;
    const type = m && m.need ? m.need : (G.weapons.sword > 0 ? "sword" : "gun");
    ctx.save();
    ctx.translate(p.x + 14, p.y - 42);
    ctx.rotate(-1.1 + k * 2.2);
    ctx.strokeStyle = `rgba(255,255,255,${1 - k * 0.85})`;
    ctx.lineWidth = 7 * (1 - k * 0.4);
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.arc(0, 0, 44, -0.9, 0.5);
    ctx.stroke();
    ctx.strokeStyle = `rgba(150,230,255,${(1 - k) * 0.9})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, 52, -0.8, 0.4);
    ctx.stroke();
    drawWeaponIcon(ctx, 34, 0, 30, type, getWeapon(type).color, 0.9 - k * 1.9);
    ctx.restore();
  }
}

function drawParticles() {
  for (const p of G.particles) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    if (p.shape === "circle") {
      circle(ctx, 0, 0, p.size);
      ctx.fill();
    } else {
      rr(ctx, -p.size / 2, -p.size / 2, p.size, p.size, p.size * 0.3);
      ctx.fill();
    }
    ctx.restore();
  }
}

function drawTexts() {
  for (const t of G.texts) {
    const a = clamp(t.life / t.max, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = `900 ${t.size}px "PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.textAlign = "center";
    ctx.lineWidth = 4;
    ctx.strokeStyle = "rgba(40,50,90,.35)";
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
    ctx.restore();
  }
}

function drawMonsterUI() {
  const m = G.monster;
  if (!m) return;

  // HP 条 + 倒计时条
  if ((m.state === "fight" || m.state === "enter") && isFinite(m.x) && isFinite(m.y)) {
    const w = 96 * m.size, h = 10;
    const x = m.x - w / 2, y = m.y - 92 * m.size;
    ctx.save();
    ctx.fillStyle = "rgba(255,255,255,.62)";
    rr(ctx, x - 3, y - 3, w + 6, h + 6, 7);
    ctx.fill();
    ctx.fillStyle = "#ffe9ef";
    rr(ctx, x, y, w, h, 5);
    ctx.fill();
    const k = m.hp / m.maxHp;
    const g1 = ctx.createLinearGradient(x, y, x + w, y);
    g1.addColorStop(0, "#ff8fab");
    g1.addColorStop(1, "#ff2f5e");
    ctx.fillStyle = g1;
    rr(ctx, x, y, Math.max(0, w * k), h, 5);
    ctx.fill();

    if (m.state === "fight") {
      const ratio = clamp(m.timer / m.fightTime, 0, 1);
      const ty = y + h + 4;
      ctx.fillStyle = "rgba(255,255,255,.55)";
      rr(ctx, x, ty, w, 5, 2.5);
      ctx.fill();
      ctx.fillStyle = ratio < 0.3 ? "#ff2f5e" : ratio < 0.6 ? "#ffb800" : "#2fc9b4";
      rr(ctx, x, ty, Math.max(2, w * ratio), 5, 2.5);
      ctx.fill();
    }
    ctx.restore();
  }

  // 需求武器提示气泡（横幅出现时隐藏，避免重叠）
  if (m.state === "fight" && !G.banner) {
    const w = getWeapon(m.need);
    const bx = m.x, by = m.y - 134 * m.size;
    ctx.save();
    ctx.font = '800 13px "PingFang SC","Microsoft YaHei",sans-serif';
    const label = "需要 " + w.name;
    const tw = ctx.measureText(label).width + 46;
    ctx.fillStyle = "rgba(255,255,255,.95)";
    rr(ctx, bx - tw / 2, by - 15, tw, 30, 15);
    ctx.fill();
    ctx.strokeStyle = w.color;
    ctx.lineWidth = 2;
    rr(ctx, bx - tw / 2, by - 15, tw, 30, 15);
    ctx.stroke();
    drawWeaponIcon(ctx, bx - tw / 2 + 19, by, 20, m.need, w.color, 0);
    ctx.fillStyle = "#3a4066";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText(label, bx - tw / 2 + 33, by + 1);
    ctx.restore();
  }
}

function drawBanner() {
  if (!G.banner) return;
  const b = G.banner;
  const k = b.t / b.dur;
  let a = 1;
  if (k < 0.14) a = k / 0.14;
  else if (k > 0.78) a = (1 - k) / 0.22;
  a = clamp(a, 0, 1);
  const scale = k < 0.14 ? lerp(1.18, 1, k / 0.14) : 1;

  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(W / 2, 100);
  ctx.scale(scale, scale);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.font = '900 30px "PingFang SC","Microsoft YaHei",sans-serif';
  const tw = ctx.measureText(b.text).width;
  const bw = Math.max(tw + 70, 260);
  ctx.fillStyle = "rgba(38,42,69,.82)";
  rr(ctx, -bw / 2, -30, bw, 60, 30);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.24)";
  ctx.lineWidth = 2;
  rr(ctx, -bw / 2, -30, bw, 60, 30);
  ctx.stroke();

  const g1 = ctx.createLinearGradient(-bw / 2, 0, bw / 2, 0);
  g1.addColorStop(0, "#ffe9a8");
  g1.addColorStop(0.5, "#ffffff");
  g1.addColorStop(1, "#ffd166");
  ctx.fillStyle = g1;
  ctx.fillText(b.text, 0, -4);
  if (b.sub) {
    ctx.font = '600 13.5px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = "rgba(255,255,255,.72)";
    ctx.fillText(b.sub, 0, 19);
  }
  ctx.restore();
}

function drawDangerVignette() {
  const m = G.monster;
  if (!m) return;
  const pulse = 0.5 + Math.sin(G.t * 5) * 0.5;
  const inten = m.doomed ? 0.55 : 0.34;
  const g1 = ctx.createRadialGradient(W / 2, H / 2, H * 0.32, W / 2, H / 2, H * 0.82);
  g1.addColorStop(0, "rgba(255,60,100,0)");
  g1.addColorStop(1, `rgba(255,50,95,${inten * (0.55 + pulse * 0.45)})`);
  ctx.fillStyle = g1;
  ctx.fillRect(0, 0, W, H);
}

function render() {
  ctx.save();
  if (G.shake > 0.5) {
    ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);
  }
  drawBackground();
  drawPickups();
  drawObstacles();
  if (G.monster) drawMonster(ctx, G.monster);
  drawPlayer();
  drawParticles();
  drawTexts();
  ctx.restore();

  drawDangerVignette();
  drawMonsterUI();
  drawBanner();
}

/* ==================================================================
   14. HUD
   ================================================================== */
let hudCache = "";
function syncHUD() {
  const sig = [G.hearts, Math.round(G.energy), G.stage, Math.floor(G.dist),
    G.weapons.sword, G.weapons.gun, G.weapons.cannon,
    G.monster ? G.monster.need : "-", G.monster ? G.monster.state : "-", G.banner ? 1 : 0].join("|");
  if (sig === hudCache) return;
  hudCache = sig;

  // 血量
  const hEl = $("#hudHearts");
  let html = "";
  for (let i = 0; i < G.maxHearts; i++) {
    html += `<span class="${i < G.hearts ? "" : "off"}">${ICON.heart}</span>`;
  }
  hEl.innerHTML = html;

  // 武器
  const need = G.monster && G.monster.state === "fight" ? G.monster.need : null;
  const wEl = $("#hudWeapons");
  let wh = "";
  for (const w of WEAPONS) {
    const d = G.weapons[w.id] || 0;
    const maxDur = w.dur + G.mods.wdur;
    const pct = clamp((d / maxDur) * 100, 0, 100);
    const cls = ["wchip"];
    if (d <= 0) cls.push("empty");
    if (need === w.id) cls.push("need");
    wh += `<div class="${cls.join(" ")}" style="color:${w.color}">
      ${ICON[w.id]}
      <span class="n">${d}</span>
      <span class="bar" style="width:${pct}%"></span>
    </div>`;
  }
  wEl.innerHTML = wh;

  $("#hudStage").textContent = "第 " + G.stage + " 关";
  $("#hudDist").textContent = Math.floor(G.dist) + " m";
  $("#hudDist").style.opacity = G.banner ? "0" : "1";
  $("#hudEnergy").textContent = Math.round(G.energy);

  const atk = $("#attackBtn");
  if (need) atk.classList.add("hot");
  else atk.classList.remove("hot");
}

/* ==================================================================
   15. 界面切换
   ================================================================== */
function showScreen(name) {
  ["menuScreen", "playScreen", "overScreen"].forEach((id) => {
    $("#" + id).classList.toggle("active", id === name + "Screen");
  });
  document.body.classList.toggle("playing", name === "play");
  G.state = name === "play" ? "play" : name;
  if (name === "menu") {
    G.state = "menu";
    refreshMenuStats();
    renderShop();
  }
  if (name === "play") requestAnimationFrame(scaleHud);
}

/* ---------- HUD 随画布缩放 ---------- */
const stageWrap = document.querySelector(".stage-wrap");
function scaleHud() {
  const w = stageWrap.clientWidth || 960;
  const k = clamp(w / 960, 0.66, 1.12);
  stageWrap.style.setProperty("--hud", k.toFixed(3));
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(W * dpr)) {
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineJoin = "round";
  }
}

/* ---------- 竖屏检测 ---------- */
let blocked = false;
function updateOrientation() {
  const portrait = window.innerHeight > window.innerWidth * 1.04 && window.innerWidth < 900;
  document.body.classList.toggle("portrait", portrait);
  blocked = portrait;
  scaleHud();
}
window.addEventListener("resize", updateOrientation);
window.addEventListener("orientationchange", () => setTimeout(updateOrientation, 120));

function refreshMenuStats() {
  $("#menuEnergy").textContent = save.energy;
  $("#menuBest").textContent = Math.floor(save.best) + " m";
  const cos = getCostume(save.equipped.costume);
  const acc = getAccessory(save.equipped.accessory);
  $("#avatarName").textContent = cos.name + (acc.id !== "none" ? " · " + acc.name : "");
  const perks = [];
  if (cos.perk) perks.push(`<b>${cos.perk}</b>`);
  if (acc.id !== "none" && acc.perk) perks.push(`<b>${acc.perk}</b>`);
  $("#avatarPerk").innerHTML = perks.join("　");
}

/* ---------- 商店 ---------- */
let currentTab = "costume";

function affordable(price) { return save.energy >= price; }

function renderShop() {
  const grid = $("#itemsGrid");
  grid.innerHTML = "";
  let list, kind, ek;
  if (currentTab === "costume") { list = COSTUMES; kind = "costumes"; ek = "costume"; }
  else if (currentTab === "accessory") { list = ACCESSORIES; kind = "accessories"; ek = "accessory"; }
  else { list = WEAPONS; kind = "weapons"; ek = null; }

  $("#shopHint").textContent = currentTab === "weapon"
    ? "武器每局开场满耐久"
    : "用能量兑换外观";

  list.forEach((item) => {
    const owned = save.owned[kind].indexOf(item.id) >= 0;
    const equipped = ek && save.equipped[ek] === item.id;

    const card = document.createElement("div");
    card.className = "item" + (equipped ? " equipped" : "") + (!owned ? " locked" : "");

    // 预览
    const prev = document.createElement("canvas");
    prev.className = "item-prev";
    prev.width = 88; prev.height = 100;
    card.appendChild(prev);

    if (equipped) {
      const tag = document.createElement("div");
      tag.className = "item-tag";
      tag.textContent = "穿戴中";
      card.appendChild(tag);
    }

    const nm = document.createElement("div");
    nm.className = "item-name";
    nm.textContent = item.name;
    card.appendChild(nm);

    const pk = document.createElement("div");
    pk.className = "item-perk";
    if (currentTab === "weapon") {
      pk.textContent = `${item.counter} · 耐久 ${item.dur + 0} 次`;
    } else {
      pk.textContent = item.perk || "";
    }
    card.appendChild(pk);

    const btn = document.createElement("button");
    if (!owned) {
      btn.className = "item-btn buy";
      btn.innerHTML = `${ICON.energy}<span>${item.price}</span>`;
      if (!affordable(item.price)) btn.disabled = true;
      btn.onclick = () => {
        if (!affordable(item.price)) return;
        save.energy -= item.price;
        save.owned[kind].push(item.id);
        persist();
        Sound.gift();
        refreshMenuStats();
        renderShop();
      };
    } else if (currentTab === "weapon") {
      btn.className = "item-btn done";
      btn.textContent = "已拥有";
    } else if (equipped) {
      btn.className = "item-btn done";
      btn.textContent = "已穿戴";
    } else {
      btn.className = "item-btn wear";
      btn.textContent = "穿上";
      btn.onclick = () => {
        save.equipped[ek] = item.id;
        persist();
        Sound.beep(660, 0.1, "sine", 0.05);
        refreshMenuStats();
        renderShop();
        previewDirty = true;
      };
    }
    card.appendChild(btn);
    grid.appendChild(card);

    // 绘制预览
    requestAnimationFrame(() => {
      const g = prev.getContext("2d");
      g.clearRect(0, 0, 88, 100);
      if (currentTab === "weapon") {
        drawWeaponIcon(g, 44, 48, 56, item.id, item.color, -0.25);
        // 光晕
        g.globalAlpha = 0.16;
        g.fillStyle = item.color;
        circle(g, 44, 48, 34); g.fill();
      } else {
        const cosId = currentTab === "costume" ? item.id : save.equipped.costume;
        const accId = currentTab === "accessory" ? item.id : save.equipped.accessory;
        drawSausage(g, 44, 92, 1.02, { costume: cosId, accessory: accId, phase: 0.6 });
      }
    });
  });
}

/* ---------- 菜单预览动画 ---------- */
let previewDirty = true;
function drawMenuPreview(time) {
  const c = $("#previewCanvas");
  const g = c.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (c.width !== 250 * dpr) {
    c.width = 250 * dpr;
    c.height = 300 * dpr;
  }
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, 250, 300);
  g.lineJoin = "round";

  const t = time / 1000;
  // 底座光晕
  const gl = g.createRadialGradient(125, 258, 4, 125, 258, 108);
  gl.addColorStop(0, "rgba(122,141,255,.17)");
  gl.addColorStop(1, "rgba(122,141,255,0)");
  g.fillStyle = gl;
  g.fillRect(0, 140, 250, 160);

  // 影子
  g.fillStyle = "rgba(70,90,140,.14)";
  g.beginPath();
  g.ellipse(125, 272, 56, 11, 0, 0, Math.PI * 2);
  g.fill();

  const bounce = Math.sin(t * 2.2) * 3;
  drawSausage(g, 125, 272 + bounce, 2.6, {
    costume: save.equipped.costume,
    accessory: save.equipped.accessory,
    phase: t * 2.4,
  });
}

/* ==================================================================
   16. 输入
   ================================================================== */
window.addEventListener("keydown", (e) => {
  const k = e.key;
  if (k === "ArrowLeft" || k === "a" || k === "A") { keys.left = true; e.preventDefault(); }
  else if (k === "ArrowRight" || k === "d" || k === "D") { keys.right = true; e.preventDefault(); }
  else if (k === "ArrowUp" || k === "w" || k === "W") { keys.up = true; e.preventDefault(); }
  else if (k === "ArrowDown" || k === "s" || k === "S") { keys.down = true; e.preventDefault(); }
  else if (k === " " || k === "j" || k === "J") {
    if (G.state === "play") { attack(); e.preventDefault(); }
  } else if (k === "Escape" || k === "p" || k === "P") {
    if (G.state === "play") togglePause();
  }
});
window.addEventListener("keyup", (e) => {
  const k = e.key;
  if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = false;
  else if (k === "ArrowRight" || k === "d" || k === "D") keys.right = false;
  else if (k === "ArrowUp" || k === "w" || k === "W") keys.up = false;
  else if (k === "ArrowDown" || k === "s" || k === "S") keys.down = false;
});

// 方向按钮
document.querySelectorAll(".dbtn").forEach((btn) => {
  const key = btn.dataset.key;
  const on = (e) => { e.preventDefault(); keys[key] = true; btn.classList.add("down"); Sound.init(); };
  const off = (e) => { e.preventDefault(); keys[key] = false; btn.classList.remove("down"); };
  btn.addEventListener("pointerdown", on);
  btn.addEventListener("pointerup", off);
  btn.addEventListener("pointercancel", off);
  btn.addEventListener("pointerleave", off);
  btn.addEventListener("contextmenu", (e) => e.preventDefault());
});

// 击打
const atkBtn = $("#attackBtn");
atkBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); Sound.init(); attack(); });

$("#pauseBtn").addEventListener("click", togglePause);
$("#resumeBtn").addEventListener("click", togglePause);
$("#quitBtn").addEventListener("click", () => {
  paused = false;
  $("#pauseOverlay").classList.remove("on");
  endRun("放弃本局，回到更衣室");
});

function togglePause() {
  if (G.state !== "play") return;
  paused = !paused;
  $("#pauseOverlay").classList.toggle("on", paused);
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden && G.state === "play" && !paused) togglePause();
});

/* ---------- 菜单交互 ---------- */
document.querySelectorAll(".tab").forEach((t) => {
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((x) => x.classList.remove("on"));
    t.classList.add("on");
    currentTab = t.dataset.tab;
    renderShop();
    Sound.beep(520, 0.06, "sine", 0.04);
  });
});
$("#startBtn").addEventListener("click", () => { Sound.init(); Sound.stageUp(); startRun(); });
$("#overAgain").addEventListener("click", () => { startRun(); });
$("#overHome").addEventListener("click", () => { showScreen("menu"); });

/* ==================================================================
   17. 主循环
   ================================================================== */
let last = performance.now();
function loop(now) {
  const rawDt = (now - last) / 1000;
  last = now;
  const dt = Math.min(0.048, rawDt);

  if (G.state === "play" && !paused && !blocked) {
    update(dt);
    if (G.state === "play") render();
  } else if (G.state === "play" && (paused || blocked)) {
    render();
  } else if (G.state === "menu") {
    drawMenuPreview(now);
  }
  requestAnimationFrame(loop);
}

/* ==================================================================
   18. 启动
   ================================================================== */
loadSave();
// 首次进入给一点见面礼，让玩家能立刻兑换第一件东西
if (!save.seen) {
  save.seen = true;
  save.energy += 120;
  persist();
}
refreshMenuStats();
renderShop();
updateOrientation();
requestAnimationFrame(loop);

// 开发调试入口（仅在 URL 带 ?debug 时暴露，不影响正常游戏）
if (location.search.indexOf("debug") >= 0) {
  window.__dbg = { G, get save() { return save; }, startRun, endRun, spawnMonster, attack, banner };
}

})();
</script>
</body>
